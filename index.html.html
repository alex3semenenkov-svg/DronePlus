 <div class="app" id="app">

<script>
(function(){'use strict';
const DBKEY='dronplus_store_v1', VERSION=2;
const I={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',box:'<path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="M3 7v10l9 5 9-5V7M12 12v10"/>',cart:'<circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/><path d="M2 3h2l3 13h13l2-9H5"/>',plus:'<path d="M12 5v14M5 12h14"/>',chart:'<path d="M4 20V9M10 20V4M16 20v-7M22 20V6"/>',receipt:'<path d="M4 2v20l4-3 4 3 4-3 4 3V2Z"/><path d="M8 7h8M8 11h8M8 15h5"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',chev:'<path d="m9 18 6-6-6-6"/>',arrow:'<path d="M12 19V5m-7 7 7-7 7 7"/>',down:'<path d="M12 5v14m-7-7 7 7 7-7"/>',truck:'<path d="M3 5h12v12H3zM15 9h4l3 4v4h-7z"/><circle cx="7.5" cy="19" r="2"/><circle cx="18.5" cy="19" r="2"/>',wallet:'<rect x="2" y="6" width="20" height="15" rx="2"/><path d="M2 10h20M5 6V3h14"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',layers:'<path d="m12 2 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 17l9 5 9-5"/>',check:'<path d="m5 12 4 4L19 6"/>',edit:'<path d="m3 17 12-12 4 4L7 21H3v-4ZM13 7l4 4"/>',file:'<path d="M5 3h10l4 4v14H5zM15 3v5h4M8 12h8M8 16h8"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',calculator:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/>',orders:'<path d="M4 3h16v18l-4-2-4 2-4-2-4 2V3Z"/><path d="M8 8h8M8 12h8M8 16h5"/>',settings:'<path d="M4 6h16M4 12h16M4 18h16"/>'};
function icon(n,s=20){return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||I.box}</svg>`}
const fmt=new Intl.NumberFormat('uk-UA',{minimumFractionDigits:0,maximumFractionDigits:2}); const money=n=>fmt.format(finite(n))+' ₴';const dollars=n=>fmt.format(finite(n))+' $';function finite(x){return Number.isFinite(+x)?+x:0}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function num(s){let n=Number(String(s??'').replace(',','.').replace(/\s/g,''));return Number.isFinite(n)?n:NaN}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function month(){return today().slice(0,7)}function timeFmt(date){try{return new Date(date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}catch{return date}}function uid(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now()+Math.random().toString(36).slice(2)}
const defaultProfile=()=>({sellerName:'',taxId:'',iban:'',bank:'',address:'',phone:'',paymentNote:'Оплата за товар згідно з рахунком',vat:'Без ПДВ'});const defaultCalc=()=>({markup:35,monthlyUnits:100,singleTax:1729.40,military:864.70,esv:1902.34,commission:0,delivery:0});const empty=()=>({version:VERSION,products:[],purchases:[],sales:[],orders:[],orderSeq:0,profile:defaultProfile(),calc:defaultCalc(),createdAt:new Date().toISOString()}); let db=load(); let view='home', category='Все', query='', monthFilter=month(),saleFilter='Все', detail=null, toastTimer=null; let storageWorking=true;
function normalizeDB(o){if(!o||!Array.isArray(o.products)||!Array.isArray(o.purchases)||!Array.isArray(o.sales))throw Error('Invalid backup');return {...o,version:VERSION,orders:Array.isArray(o.orders)?o.orders:[],orderSeq:Number.isInteger(o.orderSeq)&&o.orderSeq>=0?o.orderSeq:0,profile:{...defaultProfile(),...(o.profile||{})},calc:{...defaultCalc(),...(o.calc||{})}}}function load(){try{const raw=localStorage.getItem(DBKEY);return raw?normalizeDB(JSON.parse(raw)):empty()}catch{return empty()}}
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(db));storageWorking=true}catch(e){storageWorking=false;notify('Не удалось сохранить данные: проверь память браузера')}}
function product(id){return db.products.find(x=>x.id===id)}function activeItems(){return db.products.filter(x=>!x.archived)}function sum(arr,fn){return arr.reduce((a,x)=>a+fn(x),0)}function goodSales(m=monthFilter){return db.sales.filter(s=>!s.canceled&&s.date.slice(0,7)===m)}function monthlyPurchases(m=monthFilter){return db.purchases.filter(p=>p.date.slice(0,7)===m)}function costOfSale(s){return sum(s.items,it=>it.costUAH*it.qty)}function revenueOfSale(s){return sum(s.items,it=>it.unitPrice*it.qty)}function profitOfSale(s){return revenueOfSale(s)-costOfSale(s)}function groupedProducts(){const all=activeItems();return Array.from(new Set(all.map(x=>x.category).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'ru'))}
function notify(t){let el=document.getElementById('toast');el.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.innerHTML='',3200)}function render(){document.getElementById('headerDate').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short'});document.getElementById('main').innerHTML=({home:homeView,products:productsView,orders:ordersView,sales:salesView,purchases:purchasesView,reports:reportsView,calculator:calculatorView,profile:profileView,more:moreView}[view]||homeView)();document.getElementById('bottom').innerHTML=[['home','Главная','home'],['products','Товары','box'],['orders','Заказы','orders'],['sales','Продажи','cart'],['more','Ещё','menu']].map(([id,label,ic])=>`<button class="navbtn ${view===id?'active':''}" data-nav="${id}" aria-label="${label}"><span class="navpill">${icon(ic)}</span><span>${label}</span></button>`).join('');if(view==='calculator')refreshCalculator()}
function header(title,sub,button){return `<div class="sectionhead"><div><h1 class="h1">${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${button||''}</div>`}function plusBtn(action){return `<button class="floatingadd" data-open="${action}" aria-label="Добавить">${icon('plus')}</button>`}function zero(title,sub,button='',type='box'){return `<div class="panel"><div class="empty"><div class="emptyicon">${icon(type,28)}</div><h3>${title}</h3><p>${sub}</p>${button}</div></div>`}function stat(label,val,ic,good=false){return `<div class="stat ${good?'good':''}"><div class="iconbg">${icon(ic,18)}</div><div class="eyebrow">${label}</div><div class="val ${String(val).length>11?'smaller':''}">${val}</div></div>`}
function homeView(){const sales=goodSales(month()), rev=sum(sales,revenueOfSale), profit=sum(sales,profitOfSale), stock=sum(activeItems(),p=>p.qty), outs=activeItems().filter(p=>p.qty<=3);let recent=db.sales.filter(s=>!s.canceled).slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,4);return header('Обзор','Магазин под контролем',`<button class="linkbtn" data-nav="reports">Отчёты →</button>`)+`<div class="stats">${stat('Продажи за месяц',money(rev),'wallet')}${stat('Валовая прибыль',money(profit),'chart',true)}${stat('Единиц на складе',fmt.format(stock),'box')}${stat('Продаж за месяц',fmt.format(sales.length),'receipt')}</div><div class="actions"><button class="action" data-open="sale">${icon('plus')} Новая продажа</button><button class="action secondary" data-open="order">${icon('orders')} Новый заказ</button></div><div class="btnrow" style="margin-bottom:18px"><button class="smallbtn" data-nav="calculator">${icon('calculator',14)} Наценка</button><button class="smallbtn" data-open="purchase">${icon('down',14)} Приход</button></div>${outs.length?`<div class="label">Заканчивается на складе</div><div class="panel">${outs.slice(0,5).map(p=>productRow(p)).join('')}</div>`:''}<div class="label">Последние продажи</div>${recent.length?`<div class="panel">${recent.map(s=>saleRow(s)).join('')}</div>`:zero('Пока нет продаж','Добавь товар и оформи первую продажу.',`<button class="smallbtn" data-open="product">Добавить товар</button>`,'cart')}${!storageWorking?`<div class="vspace"></div><div class="note warn">Браузер не сохраняет данные. Не используй приложение до решения проблемы.</div>`:''}`}
function productRow(p){return `<button class="item" data-product="${esc(p.id)}"><span class="glyph">${icon('box',21)}</span><span class="grow"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.sku||'Без артикула')} · ${esc(p.category||'Без группы')}</div></span><span class="right"><div class="number ${p.qty<=3?'countlow':''}">${fmt.format(p.qty)} шт.</div><div class="muted">${money(p.priceUAH)}</div></span><span class="chev">${icon('chev',16)}</span></button>`}
function productsView(){let items=activeItems();if(category!=='Все')items=items.filter(x=>category==='Мало'?x.qty<=3:x.category===category);if(query.trim()){const q=query.trim().toLowerCase();items=items.filter(x=>(x.name+' '+x.sku+' '+x.category).toLowerCase().includes(q))}items.sort((a,b)=>a.name.localeCompare(b.name,'ru'));return header('Товары',`${activeItems().length} позиций в каталоге`,plusBtn('product'))+`<div class="searchrow"><label class="search">${icon('search',18)}<input id="product-search" type="search" placeholder="Название или артикул" value="${esc(query)}" autocomplete="off"></label></div><div class="chipbar">${['Все','Мало',...groupedProducts()].map(x=>`<button class="chip ${category===x?'active':''}" data-category="${esc(x)}">${x==='Мало'?'Мало на складе':esc(x)}</button>`).join('')}</div>${items.length?`<div class="panel">${items.map(productRow).join('')}</div>`:zero('Товары не найдены',activeItems().length?'Измени поиск или фильтр.':'Нажми «+», чтобы добавить первую позицию.',!activeItems().length?'<button class="smallbtn" data-open="product">Добавить товар</button>':'')}`}
function saleRow(s){const good=!s.canceled;const label=s.items.length===1?(s.items[0].name):`${s.items.length} позиции`;return `<button class="item" data-sale="${esc(s.id)}"><span class="glyph ${good?'good':''}">${icon('cart',21)}</span><span class="grow"><div class="name">${esc(label)}</div><div class="meta">${timeFmt(s.date)} · ${esc(s.customerName||s.payment||'Продажа')} ${s.ttn?'· ТТН':''}</div></span><span class="right"><div class="number">${money(revenueOfSale(s))}</div><div class="muted">${s.canceled?'Отменена':`+${money(profitOfSale(s))}`}</div></span><span class="chev">${icon('chev',16)}</span></button>`}
function salesView(){let rows=db.sales.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));if(saleFilter==='Активные')rows=rows.filter(s=>!s.canceled);else if(saleFilter==='С ТТН')rows=rows.filter(s=>!s.canceled&&s.ttn);else if(saleFilter==='Отменены')rows=rows.filter(s=>s.canceled);return header('Продажи',`${db.sales.filter(s=>!s.canceled).length} продаж всего`,plusBtn('sale'))+`<div class="chipbar">${['Все','Активные','С ТТН','Отменены'].map(x=>`<button class="chip ${saleFilter===x?'active':''}" data-salesfilter="${x}">${x}</button>`).join('')}</div>${rows.length?`<div class="panel">${rows.map(saleRow).join('')}</div>`:zero('Продаж пока нет','Здесь появятся покупки клиентов и номера отправлений.',`<button class="smallbtn" data-open="sale">Новая продажа</button>`,'cart')}`}
function purchaseRow(p){return `<button class="item" data-purchase="${esc(p.id)}"><span class="glyph">${icon('down',21)}</span><span class="grow"><div class="name">${esc(p.name)}</div><div class="meta">${timeFmt(p.date)} · ${fmt.format(p.qty)} шт. ${p.supplier?'· '+esc(p.supplier):''}</div></span><span class="right"><div class="number">${money(p.amountUAH)}</div><div class="muted">${dollars(p.unitUSD)} × ${fmt.format(p.rate)}</div></span><span class="chev">${icon('chev',16)}</span></button>`}
function purchasesView(){const arr=db.purchases.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return header('Закупки',`${arr.length} поступлений товара`,plusBtn('purchase'))+`${arr.length?`<div class="panel">${arr.map(purchaseRow).join('')}</div>`:zero('Нет закупок','Добавь поступление товара: количество, цену в долларах и курс.',`<button class="smallbtn" data-open="purchase">Новый приход</button>`,'down')}`}
function reportsView(){const s=goodSales(monthFilter),p=monthlyPurchases(monthFilter),rev=sum(s,revenueOfSale),profit=sum(s,profitOfSale),purchase=sum(p,x=>x.amountUAH),payments=['Наличные','Карта','Счёт ФОП'];return header('Отчёты','Результаты за выбранный месяц')+`<div class="monthline"><input id="monthPicker" type="month" value="${esc(monthFilter)}" aria-label="Отчётный месяц"><span class="hint">Отчёт по дате операций</span></div><div class="vspace"></div><div class="stats">${stat('Доход от продаж',money(rev),'wallet')}${stat('Валовая прибыль',money(profit),'chart',true)}${stat('Закупки за месяц',money(purchase),'down')}${stat('Количество продаж',String(s.length),'receipt')}</div><div class="label">Оплата по способам</div><div class="panel panelpad">${payments.map(m=>`<div class="payline"><span>${m}</span><strong>${money(sum(s.filter(x=>x.payment===m),revenueOfSale))}</strong></div>`).join('')}</div><p class="hint" style="margin:11px 4px">Доход и валовая прибыль рассчитаны по продажам. Закупки показаны отдельно: они не вычитаются повторно из валовой прибыли. Это управленческий отчёт, не готовая налоговая декларация.</p><div class="label">Экспорт отчётов</div><div class="panel panelpad"><div class="btnrow"><button class="ghost" data-export="sales">Продажи CSV</button><button class="ghost" data-export="purchases">Закупки CSV</button></div></div><div class="label">Резервные копии</div><div class="panel panelpad"><p class="hint" style="margin:0 0 13px">Данные хранятся на этом устройстве в браузере. Регулярно сохраняй копию, особенно перед сменой телефона или очисткой Safari.</p><div class="btnrow"><button class="primary" data-export="backup">${icon('file',18)} Сохранить копию</button><button class="ghost" id="import-btn">Восстановить</button></div><input type="file" id="importfile" accept="application/json,.json" hidden></div><div class="label">Информация</div><div class="note">DRONPLUS+ · прототип 2.0 · без сервера и регистрации. Данные разных телефонов не синхронизируются. Работает офлайн после установки с HTTPS-сайта.</div>`}
function field(label,name,type='text',value='',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(label,name,options,selected=''){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(([v,label])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(label)}</option>`).join('')}</select></div>`}
function wrapModal(title,inner){document.getElementById('modals').innerHTML=`<div class="sheetwrap" id="sheetwrap" role="presentation"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheethead"><h2>${esc(title)}</h2><button class="xbtn" id="closemodal" aria-label="Закрыть">×</button></div><div class="sheetbody">${inner}</div></div></div>`;setTimeout(()=>{let el=document.querySelector('.sheet input:not([type=hidden])');if(el&&!matchMedia('(pointer:coarse)').matches)el.focus()},80)}function closeModal(){document.getElementById('modals').innerHTML=''}
function openProductForm(p){const edit=!!p;let html=`<form id="productform"><input type="hidden" name="id" value="${esc(p?.id||'')}"><div class="formbox"><div class="formtitle">Карточка товара</div>${field('Название товара *','name','text',p?.name||'','required maxlength="120"')}${field('Артикул','sku','text',p?.sku||'','maxlength="80"')}${field('Группа (например, Autel)','category','text',p?.category||'','maxlength="60"')}${field('Цена продажи, ₴ *','price','number',p?.priceUAH??'','required min="0" step="0.01" inputmode="decimal"')}</div>${edit?'':`<div class="formbox"><div class="formtitle">Начальный остаток (не входит в закупки месяца)</div>${field('Количество, шт.','qty','number','0','required min="0" step="1" inputmode="numeric"')}<div class="fieldrow">${field('Закупка за 1 шт., $','usd','number','','min="0" step="0.01" inputmode="decimal"')}${field('Курс ₴ за 1 $','rate','number','','min="0" step="0.01" inputmode="decimal"')}</div><p class="hint">Если товар уже на складе, введи количество и себестоимость. Для новых поступлений используй раздел «Закупки».</p></div>`}<button class="primary wide" type="submit">${edit?'Сохранить изменения':'Создать товар'}</button></form>`;wrapModal(edit?'Изменить товар':'Новый товар',html)}
function openPurchaseForm(initial=''){let products=activeItems();if(!products.length){notify('Сначала создай хотя бы один товар');view='products';render();openProductForm();return}let opts=products.map(p=>[p.id,(p.sku?p.sku+' · ':'')+p.name]);let selected=initial||products[0].id;let html=`<form id="purchaseform"><div class="formbox"><div class="formtitle">Поступление на склад</div>${selectField('Товар *','productId',opts,selected)}${field('Количество, шт. *','qty','number','1','required min="1" step="1" inputmode="numeric"')}<div class="fieldrow">${field('Цена закупки за 1 шт., $ *','usd','number',product(selected)?.costUSD||'','required min="0" step="0.01" inputmode="decimal"')}${field('Курс доллара, ₴ *','rate','number',product(selected)?.rate||'','required min="0.01" step="0.01" inputmode="decimal"')}</div><p class="helper" id="purchase-preview"></p></div><div class="formbox"><div class="formtitle">Дополнительно</div>${field('Дата закупки','date','date',today(),'required')}${field('Поставщик','supplier','text','','maxlength="120"')}${field('Примечание','note','text','','maxlength="200"')}</div><button type="submit" class="primary wide">Оприходовать товар</button></form>`;wrapModal('Новая закупка',html);refreshPurchasePreview()}
function refreshPurchasePreview(){let f=document.getElementById('purchaseform');if(!f)return;let q=num(f.elements.qty.value),u=num(f.elements.usd.value),r=num(f.elements.rate.value);document.getElementById('purchase-preview').textContent=Number.isFinite(q*u*r)&&q>=0&&u>=0&&r>0?'Сумма поступления: '+money(q*u*r):'Введи цену и курс для расчёта'}
function cartLine(pId='',qty=1,unitPrice=''){let products=activeItems().filter(p=>p.qty>0);let selected=product(pId)&&product(pId).qty>0?pId:(products[0]?.id||'');let p=product(selected);return `<div class="cartitem"><div class="carthead"><select name="cartProduct" aria-label="Выбрать товар">${products.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)} · ${fmt.format(x.qty)} шт.</option>`).join('')}</select><button type="button" class="iconbtn" data-remove-item aria-label="Убрать товар">${icon('trash',18)}</button></div><div class="fieldrow">${field('Количество','cartQty','number',qty,'required min="1" step="1" inputmode="numeric"')}${field('Цена за 1 шт., ₴','cartPrice','number',unitPrice===''?p?.priceUAH||0:unitPrice,'required min="0" step="0.01" inputmode="decimal"')}</div><div class="hint cart-available">Доступно: ${p?.qty||0} шт.</div></div>`}
function openSaleForm(initial=''){let products=activeItems().filter(p=>p.qty>0);if(!products.length){notify('Для продажи нужен товар с положительным остатком');view='products';render();return}const html=`<form id="saleform"><div class="formbox"><div class="formtitle">Состав продажи</div><div id="cartrows">${cartLine(initial)}</div><button type="button" class="smallbtn" id="additem">${icon('plus',14)} Добавить ещё товар</button><div class="sep"></div><div class="totalrow"><span>Сумма продажи</span><strong id="saletotal">0 ₴</strong></div><div class="totalrow"><span>Валовая прибыль (оценка)</span><strong class="profit" id="saleprofit">0 ₴</strong></div></div><div class="formbox"><div class="formtitle">Покупатель и оплата</div>${field('Имя / данные покупателя','customerName','text','','maxlength="120"')}${field('Телефон покупателя','customerPhone','tel','','maxlength="40"')}${selectField('Способ оплаты *','payment',[['Наличные','Наличные'],['Карта','Карта'],['Счёт ФОП','Счёт ФОП']],'Карта')}</div><div class="formbox"><div class="formtitle">Доставка (по необходимости)</div>${field('Номер ТТН','ttn','text','','maxlength="60"')}${selectField('Статус заказа','status',[['Новая','Новая'],['Отправлена','Отправлена'],['Доставлена','Доставлена']],'Новая')}${field('Дата продажи','date','date',today(),'required')}${field('Примечание','note','text','','maxlength="300"')}</div><button class="primary good wide" type="submit">${icon('check')} Сохранить продажу</button></form>`;wrapModal('Новая продажа',html);refreshSalePreview()}
function cartRows(){return [...document.querySelectorAll('#cartrows .cartitem')]}function refreshSalePreview(){let tot=0,pro=0;cartRows().forEach(row=>{const p=product(row.querySelector('[name=cartProduct]').value),q=num(row.querySelector('[name=cartQty]').value),price=num(row.querySelector('[name=cartPrice]').value);let ok=Number.isFinite(q)&&Number.isFinite(price)&&q>0&&price>=0; if(ok){tot+=q*price;pro+=q*(price-(p?.avgCostUAH||0))}row.querySelector('.cart-available').textContent=`Доступно: ${p?.qty||0} шт.`});let a=document.getElementById('saletotal'),b=document.getElementById('saleprofit');if(a)a.textContent=money(tot);if(b)b.textContent=money(pro)}

function openPurchaseDetail(p){wrapModal('Поступление · '+timeFmt(p.date),`<div class="formbox"><div class="payline"><span>Товар</span><strong>${esc(p.name)}</strong></div><div class="payline"><span>Количество</span><strong>${fmt.format(p.qty)} шт.</strong></div><div class="payline"><span>Цена за 1 шт.</span><strong>${dollars(p.unitUSD)}</strong></div><div class="payline"><span>Курс</span><strong>${fmt.format(p.rate)}</strong></div><div class="payline"><span>Стоимость в гривнах</span><strong>${money(p.amountUAH)}</strong></div><div class="payline"><span>Поставщик</span><strong>${esc(p.supplier||'—')}</strong></div>${p.note?`<div class="sep"></div><p class="hint">${esc(p.note)}</p>`:''}</div><div class="note">Закупки не удаляются автоматически, чтобы история склада оставалась корректной.</div>`)}
function getFormData(f){return Object.fromEntries(new FormData(f).entries())}
function handleProductForm(f){let d=getFormData(f),name=d.name.trim(),price=num(d.price),sku=d.sku.trim(),cat=d.category.trim()||'Без группы';if(!name||!Number.isFinite(price)||price<0){notify('Укажи название и корректную цену');return}if(db.products.some(p=>p.sku&&sku&&p.sku.toLowerCase()===sku.toLowerCase()&&p.id!==d.id)){notify('Такой артикул уже есть');return}if(d.id){const p=product(d.id);if(!p)return;p.name=name;p.sku=sku;p.category=cat;p.priceUAH=price;save();closeModal();render();notify('Карточка обновлена')}else{const qty=num(d.qty),u=d.usd.trim()===''?0:num(d.usd),r=d.rate.trim()===''?0:num(d.rate);if(!Number.isInteger(qty)||qty<0||!Number.isFinite(u)||u<0||!Number.isFinite(r)||r<0||(qty>0&&u>0&&r<=0)){notify('Проверь количество, закупку и курс');return}db.products.push({id:uid(),name,sku,category:cat,priceUAH:price,qty,costUSD:u,rate:r,avgCostUAH:u*r,archived:false,createdAt:new Date().toISOString()});save();closeModal();view='products';category='Все';query='';render();notify('Товар создан')}}
function handlePurchaseForm(f){let d=getFormData(f),p=product(d.productId),qty=num(d.qty),usd=num(d.usd),rate=num(d.rate);if(!p||!Number.isInteger(qty)||qty<1||!Number.isFinite(usd)||usd<0||!Number.isFinite(rate)||rate<=0||!validDate(d.date)){notify('Проверь дату, количество, цену и курс');return}let unitUAH=usd*rate,amountUAH=unitUAH*qty;p.avgCostUAH=(p.qty*p.avgCostUAH+amountUAH)/(p.qty+qty);p.qty+=qty;p.costUSD=usd;p.rate=rate;db.purchases.push({id:uid(),productId:p.id,name:p.name,qty,unitUSD:usd,rate,amountUAH,supplier:d.supplier.trim(),note:d.note.trim(),date:d.date,createdAt:new Date().toISOString()});save();closeModal();view='purchases';render();notify('Приход сохранён · +'+qty+' шт.')}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T12:00:00').getTime())}
function handleSaleForm(f){let d=getFormData(f),rows=cartRows(),items=[],requested={};if(!validDate(d.date)){notify('Укажи правильную дату продажи');return}for(const row of rows){const productId=row.querySelector('[name=cartProduct]').value,p=product(productId),qty=num(row.querySelector('[name=cartQty]').value),price=num(row.querySelector('[name=cartPrice]').value);if(!p||!Number.isInteger(qty)||qty<=0||!Number.isFinite(price)||price<0){notify('Проверь позиции продажи');return}requested[productId]=(requested[productId]||0)+qty;items.push({productId,name:p.name,sku:p.sku,qty,unitPrice:price,costUAH:p.avgCostUAH})}if(!items.length){notify('Добавь товар в продажу');return}for(const [id,n] of Object.entries(requested)){if(n>product(id).qty){notify('Недостаточно на складе: '+product(id).name);return}}for(const [id,n] of Object.entries(requested))product(id).qty-=n;db.sales.push({id:uid(),items,date:d.date,customerName:d.customerName.trim(),customerPhone:d.customerPhone.trim(),payment:d.payment,ttn:d.ttn.trim(),status:d.status,note:d.note.trim(),canceled:false,createdAt:new Date().toISOString()});save();closeModal();view='sales';render();notify('Продажа сохранена. Остатки обновлены')}
function handleEditSale(f){let d=getFormData(f),s=db.sales.find(x=>x.id===d.id);if(!s||s.canceled||!validDate(d.date))return;s.customerName=d.customerName.trim();s.customerPhone=d.customerPhone.trim();s.payment=d.payment;s.ttn=d.ttn.trim();s.status=d.status;s.date=d.date;s.note=d.note.trim();save();closeModal();render();notify('Данные заказа сохранены')}
function cancelSale(id){let s=db.sales.find(x=>x.id===id);if(!s||s.canceled)return;if(!confirm('Отменить продажу? Товары вернутся на склад, продажа исчезнет из итоговых сумм.'))return;s.items.forEach(i=>{let p=product(i.productId);if(!p)return;let oldQty=p.qty;p.avgCostUAH=(p.avgCostUAH*oldQty+i.costUAH*i.qty)/(oldQty+i.qty);p.qty+=i.qty});s.canceled=true;s.canceledAt=new Date().toISOString();if(s.orderId){let o=db.orders.find(x=>x.id===s.orderId);if(o&&o.saleId===s.id){o.saleId=null;o.status='Оплачен'}}save();closeModal();render();notify('Продажа отменена, остатки восстановлены')}
function newFile(name,data,mime){const blob=new Blob([data],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function csvCell(x){let v=String(x??'');return '"'+v.replace(/"/g,'""')+'"'}function csv(rows){return '\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')}
function exportFile(which){if(which==='backup'){newFile('DRONPLUS_backup_'+today()+'.json',JSON.stringify(db,null,2),'application/json');notify('Резервная копия готова');return}if(which==='sales'){let rows=[['Дата','Товар','Артикул','Кол-во','Цена продажи ₴','Сумма ₴','Себестоимость ₴','Валовая прибыль ₴','Оплата','Покупатель','Телефон','ТТН','Статус','Примечание']];for(let s of goodSales(monthFilter)){for(let it of s.items)rows.push([s.date,it.name,it.sku,it.qty,it.unitPrice,it.qty*it.unitPrice,it.costUAH*it.qty,(it.unitPrice-it.costUAH)*it.qty,s.payment,s.customerName,s.customerPhone,s.ttn,s.status,s.note])}newFile('DRONPLUS_sales_'+monthFilter+'.csv',csv(rows),'text/csv;charset=utf-8');notify('Отчёт продаж готов');return}let rows=[['Дата','Название','Количество','Закупка USD / шт.','Курс ₴','Сумма ₴','Поставщик','Примечание']];for(let p of monthlyPurchases())rows.push([p.date,p.name,p.qty,p.unitUSD,p.rate,p.amountUAH,p.supplier,p.note]);newFile('DRONPLUS_purchases_'+monthFilter+'.csv',csv(rows),'text/csv;charset=utf-8');notify('Отчёт закупок готов')}
function importFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let dat=JSON.parse(reader.result);if(![1,2].includes(dat.version)||!Array.isArray(dat.products)||!Array.isArray(dat.purchases)||!Array.isArray(dat.sales))throw new Error('format');if(dat.products.length>20000||dat.sales.length>50000||dat.purchases.length>50000)throw new Error('size');if(!confirm('Заменить ВСЕ текущие товары, закупки и продажи данными из резервной копии? Это нельзя отменить.'))return;db=normalizeDB(dat);save();view='home';render();notify('Резервная копия восстановлена')}catch(e){notify('Не удалось открыть копию. Нужен JSON-файл DRONPLUS+')}};reader.readAsText(file)}

let calcFocusProduct='';
function moreView(){return header('Ещё','Настройки и инструменты магазина')+`<div class="panel">${[['purchases','Закупки · приход товара','down'],['reports','Отчёты и резервная копия','chart'],['calculator','Калькулятор наценки','calculator'],['profile','Реквизиты ФОП для счетов','file']].map(([id,label,ic])=>`<button class="menuitem" data-nav="${id}"><span>${icon(ic,20)} ${label}</span>${icon('chev',16)}</button>`).join('')}</div><div class="label">Быстрые действия</div><div class="actions"><button class="action" data-open="order">${icon('orders')} Новый заказ</button><button class="action secondary" data-open="purchase">${icon('down')} Приход</button></div><div class="note">Данные хранятся только в этом браузере. Делай резервную копию в разделе «Отчёты» перед обновлением адреса сайта или сменой телефона.</div>`}
function orderSum(o){return sum(o.items,i=>i.qty*i.unitPrice)}
function orderRow(o){const colors={'Оплачен':'','Выставлен':'gold','Черновик':'gray','Отменён':'red','Продан':'gray'};return `<button class="item ${o.status==='Отменён'?'disabled-order':''}" data-order="${esc(o.id)}"><span class="glyph">${icon('orders',21)}</span><span class="grow"><div class="name">№ ${esc(o.number)} · ${esc(o.customerName||'Покупатель не указан')}</div><div class="meta">${timeFmt(o.date)} · ${o.items.length} поз. · <span class="tag ${colors[o.status]||''}">${esc(o.status)}</span></div></span><span class="right"><div class="number">${money(orderSum(o))}</div><div class="muted">${o.items.reduce((n,it)=>n+it.qty,0)} шт.</div></span><span class="chev">${icon('chev',16)}</span></button>`}
function ordersView(){const orders=db.orders.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return header('Заказы',`${orders.length} заказов · товар не списывается до продажи`,plusBtn('order'))+`<div class="actions"><button class="action" data-open="order">${icon('plus',18)} Собрать заказ</button><button class="action secondary" data-nav="profile">${icon('file',18)} Реквизиты ФОП</button></div>${orders.length?`<div class="panel">${orders.map(orderRow).join('')}</div>`:zero('Заказов ещё нет','Добавь позиции из каталога, отправь клиенту список и выпиши счёт на оплату.',`<button class="smallbtn" data-open="order">Создать заказ</button>`,'orders')}<div class="helperblock">Создание заказа не уменьшает остаток и не увеличивает выручку. После получения оплаты отметь заказ «Оплачен» и проведи продажу — только тогда товар спишется со склада.</div>`}
function orderLine(item=null,initial=''){const products=activeItems().slice();if(item?.productId&&!products.some(p=>p.id===item.productId)&&product(item.productId))products.push(product(item.productId));products.sort((a,b)=>a.name.localeCompare(b.name,'ru'));const selected=item?.productId||initial||products[0]?.id||'',p=product(selected);return `<div class="cartitem"><div class="carthead"><select name="orderProduct" aria-label="Товар в заказе">${products.map(x=>`<option value="${esc(x.id)}" ${selected===x.id?'selected':''}>${esc(x.name)} · ${x.qty} шт.</option>`).join('')}</select><button type="button" class="iconbtn" data-remove-order-item aria-label="Убрать позицию">${icon('trash',18)}</button></div><div class="fieldrow">${field('Количество, шт.','orderQty','number',item?.qty??1,'required min="1" step="1" inputmode="numeric"')}${field('Цена, ₴ / шт.','orderPrice','number',item?.unitPrice??p?.priceUAH??0,'required min="0" step="0.01" inputmode="decimal"')}</div><p class="hint order-available">На складе: ${p?.qty||0} шт.</p></div>`}
function orderRows(){return [...document.querySelectorAll('#orderrows .cartitem')]}
function openOrderForm(o=null,initial=''){if(o?.saleId){notify('Проданный заказ уже нельзя изменить');return}if(!activeItems().length){notify('Сначала добавь товар в каталог');view='products';render();openProductForm();return}const values=o?.items?.length?o.items:[null];let html=`<form id="orderform"><input type="hidden" name="id" value="${esc(o?.id||'')}"><div class="formbox"><div class="formtitle">Позиции заказа</div><div id="orderrows">${values.map((x,i)=>orderLine(x,i===0?initial:'')).join('')}</div><button type="button" class="smallbtn" id="orderadd">${icon('plus',14)} Добавить позицию</button><div class="order-total"><span>Итого к оплате</span><strong id="ordertotal">0 ₴</strong></div></div><div class="formbox"><div class="formtitle">Покупатель</div>${field('Покупатель / организация','customerName','text',o?.customerName||'','maxlength="160"')}${field('ЄДРПОУ / РНОКПП покупателя (при необходимости)','buyerCode','text',o?.buyerCode||'','maxlength="20"')}${field('Телефон','customerPhone','tel',o?.customerPhone||'','maxlength="50"')}</div><div class="formbox"><div class="formtitle">Оформление</div>${field('Дата','date','date',o?.date||today(),'required')}${selectField('Статус','status',[['Черновик','Черновик'],['Выставлен','Выставлен'],['Оплачен','Оплачен'],['Отменён','Отменён']],o?.status||'Черновик')}${field('Комментарий / условия','note','text',o?.note||'','maxlength="300"')}</div><button type="submit" class="primary good wide">${icon('check')} ${o?'Сохранить заказ':'Создать заказ'}</button></form>`;wrapModal(o?'Заказ № '+o.number:'Новый заказ',html);refreshOrderPreview()}
function refreshOrderPreview(){let total=0;orderRows().forEach(row=>{let p=product(row.querySelector('[name=orderProduct]').value),qty=num(row.querySelector('[name=orderQty]').value),price=num(row.querySelector('[name=orderPrice]').value);if(Number.isInteger(qty)&&qty>0&&Number.isFinite(price)&&price>=0)total+=qty*price;const a=row.querySelector('.order-available');if(a)a.textContent=`На складе: ${p?.qty??0} шт. (резерва нет)`});let el=document.getElementById('ordertotal');if(el)el.textContent=money(total)}
function handleOrderForm(f){let d=getFormData(f),items=[];if(!validDate(d.date)){notify('Укажи правильную дату заказа');return}for(let row of orderRows()){let p=product(row.querySelector('[name=orderProduct]').value),qty=num(row.querySelector('[name=orderQty]').value),price=num(row.querySelector('[name=orderPrice]').value);if(!p||!Number.isInteger(qty)||qty<1||!Number.isFinite(price)||price<0){notify('Проверь товары, количество и цену');return}items.push({productId:p.id,name:p.name,sku:p.sku,qty,unitPrice:Math.round(price*100)/100})}if(!items.length){notify('Добавь хотя бы одну позицию');return}let o=d.id?db.orders.find(x=>x.id===d.id):null;if(d.id&&(!o||o.saleId)){notify('Этот заказ нельзя изменить');return}if(o){Object.assign(o,{items,date:d.date,customerName:d.customerName.trim(),buyerCode:d.buyerCode.trim(),customerPhone:d.customerPhone.trim(),status:d.status,note:d.note.trim(),updatedAt:new Date().toISOString()})}else{let n;do{db.orderSeq++;n=new Date(d.date+'T12:00:00').getFullYear()+'-'+String(db.orderSeq).padStart(4,'0')}while(db.orders.some(x=>x.number===n));o={id:uid(),number:n,items,date:d.date,customerName:d.customerName.trim(),buyerCode:d.buyerCode.trim(),customerPhone:d.customerPhone.trim(),status:d.status,note:d.note.trim(),saleId:null,createdAt:new Date().toISOString()};db.orders.push(o)}save();closeModal();view='orders';render();openOrderDetail(o);notify('Заказ №'+o.number+' сохранён')}
function openOrderDetail(o){const s=o.saleId?db.sales.find(x=>x.id===o.saleId):null;let items=o.items.map(i=>`<div class="payline"><span style="max-width:62%">${esc(i.name)}<br><span class="hint">${i.qty} × ${money(i.unitPrice)}</span></span><strong>${money(i.qty*i.unitPrice)}</strong></div>`).join('');let html=`<div class="formbox"><div class="formtitle">Заказ № ${esc(o.number)} · ${esc(o.status)}</div>${items}<div class="order-total"><span>Сумма заказа</span><strong>${money(orderSum(o))}</strong></div><div class="totalrow"><span>Дата</span><strong>${esc(o.date)}</strong></div><div class="totalrow"><span>Покупатель</span><strong>${esc(o.customerName||'Не указан')}</strong></div>${o.customerPhone?`<div class="totalrow"><span>Телефон</span><strong>${esc(o.customerPhone)}</strong></div>`:''}${o.note?`<div class="sep"></div><p class="hint">${esc(o.note)}</p>`:''}</div><div class="btnrow"><button class="primary" data-action="share-order" data-id="${esc(o.id)}">${icon('file',17)} Отправить список</button><button class="primary good" data-action="invoice-order" data-id="${esc(o.id)}">${icon('receipt',17)} Счёт PDF</button></div><div class="vspace"></div>${!s&&o.status!=='Отменён'?`<div class="btnrow"><button class="ghost" data-action="edit-order" data-id="${esc(o.id)}">Изменить</button>${o.status!=='Оплачен'?`<button class="ghost" data-action="paid-order" data-id="${esc(o.id)}">Оплачен</button>`:''}</div><div class="vspace"></div><button class="primary good wide" data-action="convert-order" data-id="${esc(o.id)}">${icon('cart')} Провести продажу и списать остаток</button><div class="vspace"></div><button class="ghost warn" style="width:100%" data-action="cancel-order" data-id="${esc(o.id)}">Отменить заказ</button>`:''}${s?'<div class="note">Продажа проведена. Остатки и выручка обновлены. Повторно провести этот заказ нельзя.</div>':''}${o.status==='Отменён'?'<div class="note">Заказ отменён. Для нового заказа создай новый документ.</div>':''}<div class="helperblock">Счёт на оплату — не фискальный чек и не подтверждение поступления денег. Для выдачи фискального чека при необходимости нужен ПРРО.</div>`;wrapModal('Заказ № '+o.number,html)}
function convertOrder(id){let o=db.orders.find(x=>x.id===id);if(!o||o.saleId||o.status==='Продан'||o.status==='Отменён')return;if(o.status!=='Оплачен'){notify('Сначала отметь заказ как оплаченный');return}const need={};for(const i of o.items){need[i.productId]=(need[i.productId]||0)+i.qty}for(const [pid,q] of Object.entries(need)){let p=product(pid);if(!p||p.qty<q){notify('Недостаточно на складе: '+(p?.name||'товар удалён'));return}}if(!confirm(`Провести заказ №${o.number} на ${money(orderSum(o))} как продажу? Остатки будут списаны.`))return;let items=o.items.map(i=>{let p=product(i.productId);return {productId:p.id,name:i.name,sku:i.sku,qty:i.qty,unitPrice:i.unitPrice,costUAH:p.avgCostUAH}});for(const [pid,q] of Object.entries(need))product(pid).qty-=q;const s={id:uid(),orderId:o.id,items,date:today(),customerName:o.customerName,customerPhone:o.customerPhone,payment:'Счёт ФОП',ttn:'',status:'Новая',note:'Заказ №'+o.number+(o.note?' · '+o.note:''),canceled:false,createdAt:new Date().toISOString()};db.sales.push(s);o.saleId=s.id;o.status='Продан';save();closeModal();view='sales';render();openSaleDetail(s);notify('Продажа проведена, остатки списаны')}
function orderText(o){let p=db.profile;return `DRONPLUS+ · Заказ №${o.number} от ${o.date}\n${o.customerName?'Покупатель: '+o.customerName+'\n':''}\n`+o.items.map((i,k)=>`${k+1}. ${i.name}${i.sku?' ['+i.sku+']':''}\n   ${i.qty} шт. × ${money(i.unitPrice)} = ${money(i.qty*i.unitPrice)}`).join('\n')+`\n\nИТОГО: ${money(orderSum(o))}\n${p.sellerName?'Получатель: '+p.sellerName+'\n':''}${p.iban?'IBAN: '+p.iban+'\n':''}${p.taxId?'РНОКПП/ЄДРПОУ: '+p.taxId+'\n':''}${o.note?'Примечание: '+o.note+'\n':''}`}
function fallbackCopy(text){const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');notify('Перечень скопирован. Вставь его в мессенджер')}catch{notify('Не получилось скопировать перечень')}a.remove()}
function shareOrder(o){const t=orderText(o);if(navigator.share){navigator.share({title:'Заказ DRONPLUS+ №'+o.number,text:t}).catch(err=>{if(err?.name!=='AbortError')copyOrder(t)})}else copyOrder(t)}
function copyOrder(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>notify('Перечень скопирован в буфер обмена')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function profileView(){let p=db.profile;return header('Реквизиты ФОП','Для счёта на оплату покупателю')+`<form id="profileform"><div class="formbox"><div class="formtitle">Получатель денег</div>${field('ФОП (ФИО полностью) *','sellerName','text',p.sellerName,'required maxlength="180"')}${field('РНОКПП / ЄДРПОУ *','taxId','text',p.taxId,'required maxlength="20"')}${field('IBAN UA… *','iban','text',p.iban,'required maxlength="34" autocapitalize="characters"')}${field('Название банка','bank','text',p.bank,'maxlength="120"')}${field('Адрес (необязательно)','address','text',p.address,'maxlength="250"')}${field('Контактный телефон','phone','tel',p.phone,'maxlength="50"')}${field('Назначение платежа','paymentNote','text',p.paymentNote,'maxlength="200"')}</div><div class="note" style="margin-bottom:12px">Реквизиты не подставляются автоматически из переписки: проверь IBAN и данные ФОП перед отправкой первого счёта. На счёте будет указано «Без ПДВ».</div><button class="primary good wide" type="submit">${icon('check')} Сохранить реквизиты</button></form>`}
function saveProfile(f){let d=getFormData(f),iban=d.iban.replace(/\s/g,'').toUpperCase();if(!d.sellerName.trim()||!d.taxId.trim()||!/^UA\d{27}$/.test(iban)){notify('Проверь ФИО, код и IBAN: UA + 27 цифр');return}db.profile={sellerName:d.sellerName.trim(),taxId:d.taxId.trim(),iban,bank:d.bank.trim(),address:d.address.trim(),phone:d.phone.trim(),paymentNote:d.paymentNote.trim(),vat:'Без ПДВ'};save();notify('Реквизиты сохранены');view='orders';render()}
function printInvoice(o){let p=db.profile;if(!p.sellerName.trim()||!p.taxId.trim()||!/^UA\d{27}$/.test(p.iban.replace(/\s/g,''))){closeModal();view='profile';render();notify('Сначала заполни реквизиты ФОП для счёта');return}const date=o.date.split('-').reverse().join('.');const rows=o.items.map((i,k)=>`<tr><td>${k+1}</td><td>${esc(i.name)}${i.sku?`<div class="muted">Арт. ${esc(i.sku)}</div>`:''}</td><td class="center">${i.qty}</td><td class="right">${fmt.format(i.unitPrice)}</td><td class="right">${fmt.format(i.qty*i.unitPrice)}</td></tr>`).join('');const html=`<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Рахунок DRONPLUS №${esc(o.number)}</title><style>*{box-sizing:border-box}body{background:#eef1f6;color:#161e30;font:14px/1.45 Arial,sans-serif;margin:0;padding:22px}.paper{max-width:800px;margin:auto;background:white;padding:42px 44px;box-shadow:0 10px 45px #12243b20}.brand{font-size:26px;letter-spacing:-1px;font-weight:900}.brand b{color:#ec4258}.h{font-weight:850;font-size:23px;margin:32px 0 22px}.muted{color:#687586;font-size:12px}.row{padding:6px 0}.row b{display:inline-block;min-width:115px}.divider{border-top:2px solid #152339;margin:23px 0}table{width:100%;border-collapse:collapse;margin-top:25px}th{background:#f0f3f6;text-align:left;font-size:12px}th,td{padding:10px 8px;border-bottom:1px solid #e4e8ed;vertical-align:top}td:first-child,th:first-child{width:35px}td.center{text-align:center}td.right,th.right{text-align:right;white-space:nowrap}.total{display:flex;justify-content:flex-end;gap:20px;font-size:19px;font-weight:850;margin:24px 0}.foot{color:#687586;font-size:12px;margin-top:45px}.toolbar{max-width:800px;margin:0 auto 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.toolbar button{border:0;background:#152339;border-radius:9px;padding:11px 18px;color:white;font-weight:bold;cursor:pointer}@page{size:A4;margin:12mm}@media print{body{background:#fff;padding:0}.toolbar{display:none}.paper{padding:0;box-shadow:none;max-width:none}tr{break-inside:avoid}}@media(max-width:520px){.paper{padding:26px 17px}.row b{min-width:90px}body{padding:10px}th,td{padding:7px 4px;font-size:11px}.total{font-size:16px}}</style></head><body><div class="toolbar"><b>Рахунок готовий до друку</b><button onclick="window.print()">Друкувати / Зберегти PDF</button></div><article class="paper"><div class="brand">DRONPLUS<b>+</b></div><div class="muted">Запчастини та комплектуючі</div><h1 class="h">Рахунок на оплату № ${esc(o.number)} від ${esc(date)}</h1><div class="divider"></div><div class="row"><b>Постачальник:</b> ${esc(p.sellerName)}</div><div class="row"><b>РНОКПП/ЄДРПОУ:</b> ${esc(p.taxId)}</div><div class="row"><b>IBAN:</b> ${esc(p.iban)}</div>${p.bank?`<div class="row"><b>Банк:</b> ${esc(p.bank)}</div>`:''}${p.address?`<div class="row"><b>Адреса:</b> ${esc(p.address)}</div>`:''}${p.phone?`<div class="row"><b>Телефон:</b> ${esc(p.phone)}</div>`:''}<div class="divider"></div><div class="row"><b>Покупець:</b> ${esc(o.customerName||'Не зазначений')}</div>${o.buyerCode?`<div class="row"><b>ЄДРПОУ/РНОКПП:</b> ${esc(o.buyerCode)}</div>`:''}<table><thead><tr><th>№</th><th>Найменування товару</th><th>К-сть</th><th class="right">Ціна, грн</th><th class="right">Сума, грн</th></tr></thead><tbody>${rows}</tbody></table><div class="total"><span>Разом до сплати:</span><span>${money(orderSum(o))}</span></div><div style="text-align:right;font-weight:700">Без ПДВ</div>${p.paymentNote?`<p><b>Призначення платежу:</b> ${esc(p.paymentNote)} №${esc(o.number)}</p>`:''}${o.note?`<p><b>Примітка:</b> ${esc(o.note)}</p>`:''}<p class="foot">Цей рахунок є пропозицією оплати та не підтверджує фактичну оплату. Не є фіскальним чеком.</p></article></body></html>`;const w=window.open('','_blank');if(!w){newFile('Rakhunok_DRONPLUS_'+o.number+'.html',html,'text/html;charset=utf-8');notify('Всплывающее окно заблокировано — счёт сохранён как HTML');return}w.document.open();w.document.write(html);w.document.close()}
function calculatorView(){let cfg=db.calc,p=calcFocusProduct?product(calcFocusProduct):null;const cost=p?.avgCostUAH>0?Math.round(p.avgCostUAH*100)/100:'';return header('Калькулятор','Цена продажи с наценкой и налогами')+(p?`<div class="note" style="margin-bottom:12px">Товар: <b>${esc(p.name)}</b>. После расчёта можно обновить цену в его карточке.</div>`:'')+`<form id="calcform" onsubmit="return false"><div class="formbox"><div class="formtitle">Закупка и наценка</div><div class="fieldrow">${field('Закупка 1 шт. *','cost','number',cost,'min="0" step="0.01" inputmode="decimal"')}${selectField('Валюта','currency',[['uah','Гривна ₴'],['usd','Доллар $']],'uah')}</div>${field('Курс доллара ₴/$ (если закупка в $)','rate','number',p?.rate||'','min="0" step="0.01" inputmode="decimal"')}<div class="fieldrow">${field('Наценка на затраты, %','markup','number',cfg.markup,'min="0" max="10000" step="0.1" inputmode="decimal"')}${field('Доставка / другие затраты, ₴/шт.','delivery','number',cfg.delivery,'min="0" step="0.01" inputmode="decimal"')}</div>${field('Комиссия площадки / оплаты, %','commission','number',cfg.commission,'min="0" max="99" step="0.1" inputmode="decimal"')}</div><div class="formbox"><div class="formtitle">Налоги ФОП 2 группы · в месяц</div><div class="fieldrow">${field('Единый налог, ₴','singleTax','number',cfg.singleTax,'min="0" step="0.01" inputmode="decimal"')}${field('Военный сбор, ₴','military','number',cfg.military,'min="0" step="0.01" inputmode="decimal"')}</div><div class="fieldrow">${field('ЕСВ, ₴','esv','number',cfg.esv,'min="0" step="0.01" inputmode="decimal"')}${field('Ожидаемые продажи, шт./мес.','monthlyUnits','number',cfg.monthlyUnits,'min="1" step="1" inputmode="numeric"')}</div><p class="hint">Месячные платежи распределяются по предполагаемому числу проданных единиц. Если есть освобождение от ЕСВ или другая ставка, укажи свою сумму (можно 0).</p></div><div id="calcpreview"></div><div class="btnrow"><button type="button" class="ghost" data-action="save-calc">Запомнить параметры</button>${p?`<button type="button" class="primary good" data-action="apply-calc">Установить цену</button>`:''}</div></form><div class="helperblock">Это управленческая калькуляция, а не начисление налогов по отдельной продаже. Цена рассчитывается так, чтобы после распределённых налогов и комиссии осталась заданная прибыль от наценки.</div>`}
function computeCalc(){let f=document.getElementById('calcform');if(!f)return null;let get=k=>num(f.elements[k].value);let cost=get('cost'),rate=get('rate'),markup=get('markup'),delivery=get('delivery'),commission=get('commission'),tax=get('singleTax')+get('military')+get('esv'),units=get('monthlyUnits');if(!Number.isFinite(cost)||cost<0||!Number.isFinite(markup)||markup<0||!Number.isFinite(delivery)||delivery<0||!Number.isFinite(commission)||commission<0||commission>=100||!Number.isFinite(tax)||tax<0||!Number.isInteger(units)||units<=0||(f.elements.currency.value==='usd'&&(!Number.isFinite(rate)||rate<=0)))return null;let purchaseUAH=cost*(f.elements.currency.value==='usd'?rate:1),base=purchaseUAH+delivery,allocatedTax=tax/units,targetProfit=base*markup/100,price=Math.ceil((base+targetProfit+allocatedTax)/(1-commission/100)*100)/100,fee=price*commission/100,net=price-base-allocatedTax-fee;return {purchaseUAH,base,allocatedTax,targetProfit,price,fee,net,cfg:{markup,delivery,commission,singleTax:get('singleTax'),military:get('military'),esv:get('esv'),monthlyUnits:units}}}
function refreshCalculator(){let el=document.getElementById('calcpreview');if(!el)return;let x=computeCalc();if(!x){el.innerHTML='<div class="note">Введи цену закупки и проверь параметры расчёта.</div>';return}el.innerHTML=`<div class="calc-result"><div class="title">Рекомендуемая цена продажи</div><div class="amount">${money(x.price)}</div><div class="small">Ожидаемая прибыль после распределённых налогов и комиссии: <b>${money(x.net)} / шт.</b></div><div class="sep"></div><div class="totalrow"><span>Себестоимость + доставка</span><strong>${money(x.base)}</strong></div><div class="totalrow"><span>Доля месячных налогов</span><strong>${money(x.allocatedTax)}</strong></div><div class="totalrow"><span>Комиссия</span><strong>${money(x.fee)}</strong></div><div class="totalrow"><span>Чистая расчётная прибыль</span><strong class="profit">${money(x.net)}</strong></div></div>`}
function saveCalcPrefs(){let x=computeCalc();if(!x){notify('Проверь поля калькулятора');return}db.calc=x.cfg;save();notify('Параметры наценки и налогов сохранены')}
function applyCalcPrice(){let x=computeCalc(),p=product(calcFocusProduct);if(!x||!p){notify('Выбери товар и введи правильную закупочную цену');return}if(!confirm(`Установить цену ${money(x.price)} для «${p.name}»?`))return;db.calc=x.cfg;p.priceUAH=x.price;save();calcFocusProduct='';view='products';render();notify('Цена продажи обновлена')}

// Делегирование действий: одна точка обработки для всех экранов
const doc=document;
doc.addEventListener('click',e=>{const t=e.target.closest('[data-nav],[data-open],[data-product],[data-sale],[data-purchase],[data-order],[data-category],[data-salesfilter],[data-action],[data-export],[data-remove-item],[data-remove-order-item],#additem,#orderadd,#closemodal,#import-btn');if(!t){if(e.target.id==='sheetwrap')closeModal();return}if(t.dataset.nav){view=t.dataset.nav;render();scrollTo({top:0,behavior:'instant'});return}if(t.dataset.category){category=t.dataset.category;render();return}if(t.dataset.salesfilter){saleFilter=t.dataset.salesfilter;render();return}if(t.dataset.open){({product:()=>openProductForm(),purchase:()=>openPurchaseForm(),sale:()=>openSaleForm(),order:()=>openOrderForm()}[t.dataset.open])();return}if(t.dataset.product){let p=product(t.dataset.product);if(p)openProductDetail(p);return}if(t.dataset.sale){let s=db.sales.find(x=>x.id===t.dataset.sale);if(s)openSaleDetail(s);return}if(t.dataset.purchase){let p=db.purchases.find(x=>x.id===t.dataset.purchase);if(p)openPurchaseDetail(p);return}if(t.dataset.order){let o=db.orders.find(x=>x.id===t.dataset.order);if(o)openOrderDetail(o);return}if(t.dataset.export){exportFile(t.dataset.export);return}if(t.id==='import-btn'){doc.getElementById('importfile')?.click();return}if(t.id==='closemodal'){closeModal();return}if(t.id==='orderadd'){const holder=doc.createElement('div');holder.innerHTML=orderLine();doc.getElementById('orderrows').append(holder.firstElementChild);refreshOrderPreview();return}if(t.dataset.removeOrderItem!==undefined){const rows=orderRows();if(rows.length<=1){notify('В заказе должна быть минимум одна позиция');return}t.closest('.cartitem').remove();refreshOrderPreview();return}if(t.id==='additem'){let holder=doc.createElement('div');holder.innerHTML=cartLine();doc.getElementById('cartrows').append(holder.firstElementChild);refreshSalePreview();return}if(t.dataset.removeItem!==undefined){let rows=cartRows();if(rows.length<=1){notify('В продаже должна остаться хотя бы одна позиция');return}t.closest('.cartitem').remove();refreshSalePreview();return}if(t.dataset.action){let id=t.dataset.id;switch(t.dataset.action){case 'markup-product':{calcFocusProduct=id;closeModal();view='calculator';render();break}case 'order-product':closeModal();openOrderForm(null,id);break;case 'edit-order':{let o=db.orders.find(x=>x.id===id);if(o)openOrderForm(o);break}case 'invoice-order':{let o=db.orders.find(x=>x.id===id);if(o)printInvoice(o);break}case 'share-order':{let o=db.orders.find(x=>x.id===id);if(o)shareOrder(o);break}case 'paid-order':{let o=db.orders.find(x=>x.id===id);if(o&&o.status!=='Продан'&&o.status!=='Отменён'){o.status='Оплачен';save();closeModal();render();openOrderDetail(o)}break}case 'cancel-order':{let o=db.orders.find(x=>x.id===id);if(o&&o.status!=='Продан'&&confirm('Отменить заказ №'+o.number+'?')){o.status='Отменён';save();closeModal();render()}break}case 'convert-order':convertOrder(id);break;case 'save-calc':saveCalcPrefs();break;case 'apply-calc':applyCalcPrice();break;case 'sell-product':closeModal();openSaleForm(id);break;case 'restock-product':closeModal();openPurchaseForm(id);break;case 'edit-product':{let p=product(id);if(p)openProductForm(p);break}case 'archive-product':{let p=product(id);if(p&&confirm('Переместить товар «'+p.name+'» в архив? Его остаток сохранится, но товар исчезнет из активного списка.')){p.archived=true;save();closeModal();render();notify('Товар перемещён в архив')}break}case 'edit-sale':{let s=db.sales.find(x=>x.id===id);if(s)openEditSale(s);break}case 'cancel-sale':cancelSale(id);break}return}});
doc.addEventListener('submit',e=>{const formId=e.target.getAttribute('id');if(!['productform','purchaseform','saleform','editsaleform','orderform','profileform'].includes(formId))return;e.preventDefault();({productform:handleProductForm,purchaseform:handlePurchaseForm,saleform:handleSaleForm,editsaleform:handleEditSale,orderform:handleOrderForm,profileform:saveProfile}[formId])(e.target)});
doc.addEventListener('input',e=>{if(e.target.id==='product-search'){let val=e.target.value,sel=e.target.selectionStart;query=val;let parent=document.getElementById('main');if(!parent)return;let f=productsView();parent.innerHTML=f;let input=doc.getElementById('product-search');if(input){input.focus();try{input.setSelectionRange(sel,sel)}catch{}}return}if(e.target.closest('#orderform'))refreshOrderPreview();if(e.target.closest('#calcform'))refreshCalculator();if(e.target.closest('#saleform'))refreshSalePreview();if(e.target.closest('#purchaseform'))refreshPurchasePreview()});
doc.addEventListener('change',e=>{if(e.target.id==='monthPicker'){monthFilter=e.target.value||month();render();return}if(e.target.id==='importfile'){importFile(e.target.files?.[0]);return}if(e.target.matches('[name=orderProduct]')){let p=product(e.target.value);e.target.closest('.cartitem').querySelector('[name=orderPrice]').value=p?.priceUAH??0;refreshOrderPreview();return}if(e.target.matches('[name=cartProduct]')){let p=product(e.target.value);e.target.closest('.cartitem').querySelector('[name=cartPrice]').value=p?.priceUAH??0;refreshSalePreview();return}if(e.target.matches('#purchaseform [name=productId]')){let p=product(e.target.value);let f=e.target.form;f.elements.usd.value=p?.costUSD||'';f.elements.rate.value=p?.rate||'';refreshPurchasePreview()}});
doc.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('sheetwrap'))closeModal()});
render();if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script>
