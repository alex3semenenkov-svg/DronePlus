function productsView(){let items=activeItems();if(category!=='Усі')items=items.filter(x=>category==='Мало'?x.qty<=3:x.category===category);if(query.trim()){const q=query.trim().toLowerCase();items=items.filter(x=>(x.name+' '+x.sku+' '+x.category).toLowerCase().includes(q))}items.sort((a,b)=>a.name.localeCompare(b.name,'uk'));return header('Товары',`${activeItems().length} позицій у каталозі`,plusBtn('product'))+`<div class="searchrow"><label class="search">${icon('search',18)}<input id="product-search" type="search" placeholder="Назва або артикул" value="${esc(query)}" autocomplete="off"></label></div><div class="chipbar">${['Усі','Мало',...groupedProducts()].map(x=>`<button class="chip ${category===x?'active':''}" data-category="${esc(x)}">${x==='Мало'?'Мало на складі':esc(x)}</button>`).join('')}</div>${items.length?`<div class="panel">${items.map(productRow).join('')}</div>`:zero('Товари не знайдено',activeItems().length?'Зміни пошук або фільтр.':'Натисни «+», щоб додати першу позицію.',!activeItems().length?'<button class="smallbtn" data-open="product">Додати товар</button>':'')}`}

function salesView(){let rows=db.sales.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));if(saleFilter==='Активні')rows=rows.filter(s=>!s.canceled);else if(saleFilter==='З ТТН')rows=rows.filter(s=>!s.canceled&&s.ttn);else if(saleFilter==='Скасовані')rows=rows.filter(s=>s.canceled);return header('Продажи',`${db.sales.filter(s=>!s.canceled).length} продажів загалом`,plusBtn('sale'))+`<div class="chipbar">${['Усі','Активні','З ТТН','Скасовані'].map(x=>`<button class="chip ${saleFilter===x?'active':''}" data-salesfilter="${x}">${x}</button>`).join('')}</div>${rows.length?`<div class="panel">${rows.map(saleRow).join('')}</div>`:zero('Продажів ще немає','Тут будуть продажі клієнтам та номери відправлень.',`<button class="smallbtn" data-open="sale">Новий продаж</button>`,'cart')}`}
function purchaseRow(p){return `<button class="item" data-purchase="${esc(p.id)}"><span class="glyph">${icon('down',21)}</span><span class="grow"><div class="name">${esc(p.name)}</div><div class="meta">${timeFmt(p.date)} · ${fmt.format(p.qty)} шт. ${p.supplier?'· '+esc(p.supplier):''}</div></span><span class="right"><div class="number">${money(p.amountUAH)}</div><div class="muted">${dollars(p.unitUSD)} × ${fmt.format(p.rate)}</div></span><span class="chev">${icon('chev',16)}</span></button>`}

function reportsView(){const s=goodSales(monthFilter),p=monthlyPurchases(monthFilter),rev=sum(s,revenueOfSale),goods=sum(s,costOfSale),gross=rev-goods,reserve=sum(s,reserveOfSale),net=gross-reserve,purchase=sum(p,x=>x.amountUAH),payments=['Наличные','Карта','Счёт ФОП'];return header('Звіти','Фінансовий підсумок за місяць')+`<div class="monthline"><input id="monthPicker" type="month" value="${esc(monthFilter)}" aria-label="Звітний місяць"><span class="hint">За датою продажів</span></div><div class="vspace"></div><div class="stats">${stat('Виручка',money(rev),'wallet')}${stat('Орієнтовний прибуток',money(net),'chart',true)}${stat('Резерв на податки',money(reserve),'receipt')}${stat('Продажів',String(s.length),'cart')}</div><div class="label">Розрахунок прибутку</div><div class="panel panelpad"><div class="payline"><span>Виручка</span><strong>${money(rev)}</strong></div><div class="payline"><span>Собівартість проданого</span><strong>− ${money(goods)}</strong></div><div class="payline"><span>Валовий прибуток</span><strong>${money(gross)}</strong></div><div class="payline"><span>Умовний резерв на податки</span><strong>− ${money(reserve)}</strong></div><div class="payline"><span><b>Прибуток після резерву</b></span><strong class="profit">${money(net)}</strong></div></div><p class="calc-notice">Резерв обчислюється від собівартості кожної проданої одиниці за відсотком, зафіксованим під час продажу. Це не фактична сума податків ФОП. Для старих продажів без ставки резерв = 0. Реальні податки обліковуй окремо.</p><div class="label">Оплата за способами</div><div class="panel panelpad">${payments.map(m=>`<div class="payline"><span>${uaStatus(m)}</span><strong>${money(sum(s.filter(x=>x.payment===m),revenueOfSale))}</strong></div>`).join('')}</div><div class="label">Закупівлі за місяць</div><div class="panel panelpad"><div class="payline"><span>Усього надходжень</span><strong>${money(purchase)}</strong></div><p class="hint">Показано окремо. Закупівлі не віднімаються вдруге із прибутку за проданими товарами.</p></div><div class="label">Експорт звітів</div><div class="panel panelpad"><div class="btnrow"><button class="ghost" data-export="sales">Продажі CSV</button><button class="ghost" data-export="purchases">Закупівлі CSV</button></div></div><div class="label">Резервні копії</div><div class="panel panelpad"><p class="hint" style="margin:0 0 13px">Дані зберігаються локально у браузері цього пристрою. Створюй резервну копію перед оновленням сайту або зміною телефона.</p><div class="btnrow"><button class="primary" data-export="backup">${icon('file',18)} Зберегти копію</button><button class="ghost" id="import-btn">Відновити</button></div><input type="file" id="importfile" accept="application/json,.json" hidden></div><div class="label">Інформація</div><div class="note">DronePlus+ · версія 3.0 · локальне збереження. Синхронізації між пристроями немає.</div>`}
function field(label,name,type='text',value='',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(label,name,options,selected=''){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(([v,label])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(label)}</option>`).join('')}</select></div>`}

function openProductForm(p){const edit=!!p;let html=`<form id="productform"><input type="hidden" name="id" value="${esc(p?.id||'')}"><div class="formbox"><div class="formtitle">Картка товару</div>${field('Назва товару *','name','text',p?.name||'','required maxlength="120"')}${field('Артикул','sku','text',p?.sku||'','maxlength="80"')}${field('Група (наприклад, Autel)','category','text',p?.category||'','maxlength="60"')}${field('Ціна продажу, ₴ *','price','number',p?.priceUAH??'','required min="0" step="0.01" inputmode="decimal"')}</div>${edit?'':`<div class="formbox"><div class="formtitle">Початковий залишок (не входит в закупки месяца)</div>${field('Кількість, шт.','qty','number','0','required min="0" step="1" inputmode="numeric"')}<div class="fieldrow">${field('Закупівля за 1 шт., $','usd','number','','min="0" step="0.01" inputmode="decimal"')}${field('Курс ₴ за 1 $','rate','number','','min="0" step="0.01" inputmode="decimal"')}</div><p class="hint">Если товар уже на складе, введи количество и себестоимость. Для новых поступлений используй раздел «Закупки».</p></div>`}<button class="primary wide" type="submit">${edit?'Зберегти зміни':'Створити товар'}</button></form>`;wrapModal(edit?'Змінити товар':'Новий товар',html)}

function getFormData(f){return Object.fromEntries(new FormData(f).entries())}
function handleProductForm(f){let d=getFormData(f),name=d.name.trim(),price=num(d.price),sku=d.sku.trim(),cat=d.category.trim()||'Без групи';if(!name||!Number.isFinite(price)||price<0){notify('Вкажи название и корректную цену');return}if(db.products.some(p=>p.sku&&sku&&p.sku.toLowerCase()===sku.toLowerCase()&&p.id!==d.id)){notify('Такой артикул уже есть');return}if(d.id){const p=product(d.id);if(!p)return;p.name=name;p.sku=sku;p.category=cat;p.priceUAH=price;save();closeModal();render();notify('Карточка обновлена')}else{const qty=num(d.qty),u=d.usd.trim()===''?0:num(d.usd),r=d.rate.trim()===''?0:num(d.rate);if(!Number.isInteger(qty)||qty<0||!Number.isFinite(u)||u<0||!Number.isFinite(r)||r<0||(qty>0&&u>0&&r<=0)){notify('Перевір количество, закупку и курс');return}db.products.push({id:uid(),name,sku,category:cat,priceUAH:price,qty,costUSD:u,rate:r,avgCostUAH:u*r,archived:false,createdAt:new Date().toISOString()});save();closeModal();view='products';category='Усі';query='';render();notify('Товар создан')}}
function handlePurchaseForm(f){let d=getFormData(f),p=product(d.productId),qty=num(d.qty),usd=num(d.usd),rate=num(d.rate);if(!p||!Number.isInteger(qty)||qty<1||!Number.isFinite(usd)||usd<0||!Number.isFinite(rate)||rate<=0||!validDate(d.date)){notify('Перевір дату, количество, цену и курс');return}let unitUAH=usd*rate,amountUAH=unitUAH*qty;p.avgCostUAH=(p.qty*p.avgCostUAH+amountUAH)/(p.qty+qty);p.qty+=qty;p.costUSD=usd;p.rate=rate;db.purchases.push({id:uid(),productId:p.id,name:p.name,qty,unitUSD:usd,rate,amountUAH,supplier:d.supplier.trim(),note:d.note.trim(),date:d.date,createdAt:new Date().toISOString()});save();closeModal();view='purchases';render();notify('Надходження сохранён · +'+qty+' шт.')}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T12:00:00').getTime())}
function handleSaleForm(f){let d=getFormData(f),rows=cartRows(),items=[],requested={};if(!validDate(d.date)){notify('Вкажи правильную дату продажи');return}for(const row of rows){const productId=row.querySelector('[name=cartProduct]').value,p=product(productId),qty=num(row.querySelector('[name=cartQty]').value),price=num(row.querySelector('[name=cartPrice]').value);if(!p||!Number.isInteger(qty)||qty<=0||!Number.isFinite(price)||price<0){notify('Перевір позиции продажи');return}requested[productId]=(requested[productId]||0)+qty;items.push({productId,name:p.name,sku:p.sku,qty,unitPrice:price,costUAH:p.avgCostUAH,taxPct:finite(db.calc.taxPct)})}if(!items.length){notify('Добавь товар в продажу');return}for(const [id,n] of Object.entries(requested)){if(n>product(id).qty){notify('Недостаточно на складе: '+product(id).name);return}}for(const [id,n] of Object.entries(requested))product(id).qty-=n;db.sales.push({id:uid(),items,date:d.date,customerName:d.customerName.trim(),customerPhone:d.customerPhone.trim(),payment:d.payment,ttn:d.ttn.trim(),status:d.status,note:d.note.trim(),canceled:false,createdAt:new Date().toISOString()});save();closeModal();view='sales';render();notify('Продажа сохранена. Остатки обновлены')}
function handleEditSale(f){let d=getFormData(f),s=db.sales.find(x=>x.id===d.id);if(!s||s.canceled||!validDate(d.date))return;s.customerName=d.customerName.trim();s.customerPhone=d.customerPhone.trim();s.payment=d.payment;s.ttn=d.ttn.trim();s.status=d.status;s.date=d.date;s.note=d.note.trim();save();closeModal();render();notify('Данные заказа сохранены')}
function cancelSale(id){let s=db.sales.find(x=>x.id===id);if(!s||s.canceled)return;if(!confirm('Отменить продажу? Товары вернутся на склад, продажа исчезнет из итоговых сумм.'))return;s.items.forEach(i=>{let p=product(i.productId);if(!p)return;let oldQty=p.qty;p.avgCostUAH=(p.avgCostUAH*oldQty+i.costUAH*i.qty)/(oldQty+i.qty);p.qty+=i.qty});s.canceled=true;s.canceledAt=new Date().toISOString();if(s.orderId){let o=db.orders.find(x=>x.id===s.orderId);if(o&&o.saleId===s.id){o.saleId=null;o.status='Оплачен'}}save();closeModal();render();notify('Продажа отменена, остатки восстановлены')}
function newFile(name,data,mime){const blob=new Blob([data],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function csvCell(x){let v=String(x??'');return '"'+v.replace(/"/g,'""')+'"'}function csv(rows){return '\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')}
function exportFile(which){if(which==='backup'){newFile('DRONPLUS_backup_'+today()+'.json',JSON.stringify(db,null,2),'application/json');notify('Резервна копія готова');return}if(which==='sales'){let rows=[['Дата','Товар','Артикул','Кількість','Ціна продажу ₴','Сума ₴','Собівартість ₴','Валовий прибуток ₴','Резерв, %','Резерв на податки ₴','Прибуток після резерву ₴','Оплата','Покупець','Телефон','ТТН','Статус','Примітка']];for(let s of goodSales(monthFilter)){for(let it of s.items){const g=(it.unitPrice-it.costUAH)*it.qty,r=it.costUAH*it.qty*finite(it.taxPct||0)/100;rows.push([s.date,it.name,it.sku,it.qty,it.unitPrice,it.qty*it.unitPrice,it.costUAH*it.qty,g,it.taxPct??0,r,g-r,uaStatus(s.payment),s.customerName,s.customerPhone,s.ttn,uaStatus(s.status),s.note])}}newFile('DRONPLUS_sales_'+monthFilter+'.csv',csv(rows),'text/csv;charset=utf-8');notify('Звіт про продажі готовий');return}let rows=[['Дата','Назва','Кількість','Закупівля USD / шт.','Курс ₴','Сума ₴','Постачальник','Примітка']];for(let p of monthlyPurchases(monthFilter))rows.push([p.date,p.name,p.qty,p.unitUSD,p.rate,p.amountUAH,p.supplier,p.note]);newFile('DRONPLUS_purchases_'+monthFilter+'.csv',csv(rows),'text/csv;charset=utf-8');notify('Звіт про закупівлі готовий')}
function importFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let dat=JSON.parse(reader.result);if(![1,2,3].includes(dat.version)||!Array.isArray(dat.products)||!Array.isArray(dat.purchases)||!Array.isArray(dat.sales))throw new Error('format');if(dat.products.length>20000||dat.sales.length>50000||dat.purchases.length>50000)throw new Error('size');if(!confirm('Заменить ВСЕ текущие товары, закупки и продажи данными из резервной копии? Это нельзя отменить.'))return;db=normalizeDB(dat);save();view='home';render();notify('Резервная копия восстановлена')}catch(e){notify('Не удалось открыть копию. Нужен JSON-файл DRONPLUS+')}};reader.readAsText(file)}

function moreView(){return header('Ещё','Налаштування та інструменти магазину')+`<div class="panel">${[['purchases','Закупівлі · надходження','down'],['reports','Звіти та резервна копія','chart'],['calculator','Калькулятор націнки','calculator'],['profile','Реквізити ФОП для счетов','file']].map(([id,label,ic])=>`<button class="menuitem" data-nav="${id}"><span>${icon(ic,20)} ${label}</span>${icon('chev',16)}</button>`).join('')}</div><div class="label">Швидкі дії</div><div class="actions"><button class="action" data-open="order">${icon('orders')} Новый заказ</button><button class="action secondary" data-open="purchase">${icon('down')} Надходження</button></div><div class="note">Данные хранятся только в этом браузере. Делай резервную копию в разделе «Отчёты» перед обновлением адреса сайта или сменой телефона.</div>`}
function orderSum(o){return sum(o.items,i=>i.qty*i.unitPrice)}
function orderRow(o){const colors={'Оплачен':'','Выставлен':'gold','Черновик':'gray','Отменён':'red','Продан':'gray'};return `<button class="item ${o.status==='Отменён'?'disabled-order':''}" data-order="${esc(o.id)}"><span class="glyph">${icon('orders',21)}</span><span class="grow"><div class="name">№ ${esc(o.number)} · ${esc(o.customerName||'Покупця не вказано')}</div><div class="meta">${timeFmt(o.date)} · ${o.items.length} поз. · <span class="tag ${colors[o.status]||''}">${esc(uaStatus(o.status))}</span></div></span><span class="right"><div class="number">${money(orderSum(o))}</div><div class="muted">${o.items.reduce((n,it)=>n+it.qty,0)} шт.</div></span><span class="chev">${icon('chev',16)}</span></button>`}
function ordersView(){const orders=db.orders.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return header('Заказы',`${orders.length} замовлень · товар списується після продажу`,plusBtn('order'))+`<div class="actions"><button class="action" data-open="order">${icon('plus',18)} Зібрати замовлення</button><button class="action secondary" data-nav="profile">${icon('file',18)} Реквізити ФОП</button></div>${orders.length?`<div class="panel">${orders.map(orderRow).join('')}</div>`:zero('Замовлень ще немає','Додай товари з каталогу, надішли клієнту перелік і сформуй рахунок.',`<button class="smallbtn" data-open="order">Створити замовлення</button>`,'orders')}<div class="helperblock">Створення замовлення не зменшує залишок і не збільшує виручку. Після оплати познач замовлення «Оплачено», потім проведи продаж.</div>`}
function orderLine(item=null,initial=''){const products=activeItems().slice();if(item?.productId&&!products.some(p=>p.id===item.productId)&&product(item.productId))products.push(product(item.productId));products.sort((a,b)=>a.name.localeCompare(b.name,'uk'));const selected=item?.productId||initial||products[0]?.id||'',p=product(selected);return `<div class="cartitem"><div class="carthead"><select name="orderProduct" aria-label="Товар в заказе">${products.map(x=>`<option value="${esc(x.id)}" ${selected===x.id?'selected':''}>${esc(x.name)} · ${x.qty} шт.</option>`).join('')}</select><button type="button" class="iconbtn" data-remove-order-item aria-label="Убрать позицию">${icon('trash',18)}</button></div><div class="fieldrow">${field('Кількість, шт.','orderQty','number',item?.qty??1,'required min="1" step="1" inputmode="numeric"')}${field('Цена, ₴ / шт.','orderPrice','number',item?.unitPrice??p?.priceUAH??0,'required min="0" step="0.01" inputmode="decimal"')}</div><p class="hint order-available">На складе: ${p?.qty||0} шт.</p></div>`}
function orderRows(){return [...document.querySelectorAll('#orderrows .cartitem')]}
function openOrderForm(o=null,initial=''){if(o?.saleId){notify('Проданный заказ уже нельзя изменить');return}if(!activeItems().length){notify('Сначала добавь товар в каталог');view='products';render();openProductForm();return}const values=o?.items?.length?o.items:[null];let html=`<form id="orderform"><input type="hidden" name="id" value="${esc(o?.id||'')}"><div class="formbox"><div class="formtitle">Позиции заказа</div><div id="orderrows">${values.map((x,i)=>orderLine(x,i===0?initial:'')).join('')}</div><button type="button" class="smallbtn" id="orderadd">${icon('plus',14)} Добавить позицию</button><div class="order-total"><span>Итого к оплате</span><strong id="ordertotal">0 ₴</strong></div></div><div class="formbox"><div class="formtitle">Покупець</div>${field('Покупець / организация','customerName','text',o?.customerName||'','maxlength="160"')}${field('ЄДРПОУ / РНОКПП покупателя (при необходимости)','buyerCode','text',o?.buyerCode||'','maxlength="20"')}${field('Телефон','customerPhone','tel',o?.customerPhone||'','maxlength="50"')}</div><div class="formbox"><div class="formtitle">Оформление</div>${field('Дата','date','date',o?.date||today(),'required')}${selectField('Статус','status',[['Черновик','Черновик'],['Выставлен','Выставлен'],['Оплачен','Оплачен'],['Отменён','Отменён']],o?.status||'Черновик')}${field('Комментарий / условия','note','text',o?.note||'','maxlength="300"')}</div><button type="submit" class="primary good wide">${icon('check')} ${o?'Сохранить заказ':'Створити замовлення'}</button></form>`;wrapModal(o?'Заказ № '+o.number:'Новый заказ',html);refreshOrderPreview()}
function refreshOrderPreview(){let total=0;orderRows().forEach(row=>{let p=product(row.querySelector('[name=orderProduct]').value),qty=num(row.querySelector('[name=orderQty]').value),price=num(row.querySelector('[name=orderPrice]').value);if(Number.isInteger(qty)&&qty>0&&Number.isFinite(price)&&price>=0)total+=qty*price;const a=row.querySelector('.order-available');if(a)a.textContent=`На складе: ${p?.qty??0} шт. (резерва нет)`});let el=document.getElementById('ordertotal');if(el)el.textContent=money(total)}
function handleOrderForm(f){let d=getFormData(f),items=[];if(!validDate(d.date)){notify('Вкажи правильную дату заказа');return}for(let row of orderRows()){let p=product(row.querySelector('[name=orderProduct]').value),qty=num(row.querySelector('[name=orderQty]').value),price=num(row.querySelector('[name=orderPrice]').value);if(!p||!Number.isInteger(qty)||qty<1||!Number.isFinite(price)||price<0){notify('Перевір товары, количество и цену');return}items.push({productId:p.id,name:p.name,sku:p.sku,qty,unitPrice:Math.round(price*100)/100})}if(!items.length){notify('Добавь хотя бы одну позицию');return}let o=d.id?db.orders.find(x=>x.id===d.id):null;if(d.id&&(!o||o.saleId)){notify('Этот заказ нельзя изменить');return}if(o){Object.assign(o,{items,date:d.date,customerName:d.customerName.trim(),buyerCode:d.buyerCode.trim(),customerPhone:d.customerPhone.trim(),status:d.status,note:d.note.trim(),updatedAt:new Date().toISOString()})}else{let n;do{db.orderSeq++;n=new Date(d.date+'T12:00:00').getFullYear()+'-'+String(db.orderSeq).padStart(4,'0')}while(db.orders.some(x=>x.number===n));o={id:uid(),number:n,items,date:d.date,customerName:d.customerName.trim(),buyerCode:d.buyerCode.trim(),customerPhone:d.customerPhone.trim(),status:d.status,note:d.note.trim(),saleId:null,createdAt:new Date().toISOString()};db.orders.push(o)}save();closeModal();view='orders';render();openOrderDetail(o);notify('Заказ №'+o.number+' сохранён')}
function openOrderDetail(o){const s=o.saleId?db.sales.find(x=>x.id===o.saleId):null;let items=o.items.map(i=>`<div class="payline"><span style="max-width:62%">${esc(i.name)}<br><span class="hint">${i.qty} × ${money(i.unitPrice)}</span></span><strong>${money(i.qty*i.unitPrice)}</strong></div>`).join('');let html=`<div class="formbox"><div class="formtitle">Заказ № ${esc(o.number)} · ${esc(uaStatus(o.status))}</div>${items}<div class="order-total"><span>Сума замовлення</span><strong>${money(orderSum(o))}</strong></div><div class="totalrow"><span>Дата</span><strong>${esc(o.date)}</strong></div><div class="totalrow"><span>Покупець</span><strong>${esc(o.customerName||'Не вказано')}</strong></div>${o.customerPhone?`<div class="totalrow"><span>Телефон</span><strong>${esc(o.customerPhone)}</strong></div>`:''}${o.note?`<div class="sep"></div><p class="hint">${esc(o.note)}</p>`:''}</div><div class="btnrow"><button class="primary" data-action="share-order" data-id="${esc(o.id)}">${icon('file',17)} Надіслати перелік</button><button class="primary good" data-action="invoice-order" data-id="${esc(o.id)}">${icon('receipt',17)} Рахунок PDF</button></div><div class="vspace"></div>${!s&&o.status!=='Отменён'?`<div class="btnrow"><button class="ghost" data-action="edit-order" data-id="${esc(o.id)}">Изменить</button>${o.status!=='Оплачен'?`<button class="ghost" data-action="paid-order" data-id="${esc(o.id)}">Оплачен</button>`:''}</div><div class="vspace"></div><button class="primary good wide" data-action="convert-order" data-id="${esc(o.id)}">${icon('cart')} Провести продаж і списати залишок</button><div class="vspace"></div><button class="ghost warn" style="width:100%" data-action="cancel-order" data-id="${esc(o.id)}">Скасувати замовлення</button>`:''}${s?'<div class="note">Продажа проведена. Остатки и выручка обновлены. Повторно провести этот заказ нельзя.</div>':''}${o.status==='Отменён'?'<div class="note">Заказ отменён. Для нового заказа создай новый документ.</div>':''}<div class="helperblock">Рахунок на оплату — не фискальный чек и не подтверждение поступления денег. Для выдачи фискального чека при необходимости нужен ПРРО.</div>`;wrapModal('Заказ № '+o.number,html)}
function convertOrder(id){let o=db.orders.find(x=>x.id===id);if(!o||o.saleId||o.status==='Продан'||o.status==='Отменён')return;if(o.status!=='Оплачен'){notify('Сначала отметь заказ как оплаченный');return}const need={};for(const i of o.items){need[i.productId]=(need[i.productId]||0)+i.qty}for(const [pid,q] of Object.entries(need)){let p=product(pid);if(!p||p.qty<q){notify('Недостаточно на складе: '+(p?.name||'товар удалён'));return}}if(!confirm(`Провести заказ №${o.number} на ${money(orderSum(o))} как продажу? Остатки будут списаны.`))return;let items=o.items.map(i=>{let p=product(i.productId);return {productId:p.id,name:i.name,sku:i.sku,qty:i.qty,unitPrice:i.unitPrice,costUAH:p.avgCostUAH,taxPct:finite(db.calc.taxPct)}});for(const [pid,q] of Object.entries(need))product(pid).qty-=q;const s={id:uid(),orderId:o.id,items,date:today(),customerName:o.customerName,customerPhone:o.customerPhone,payment:'Счёт ФОП',ttn:'',status:'Новая',note:'Заказ №'+o.number+(o.note?' · '+o.note:''),canceled:false,createdAt:new Date().toISOString()};db.sales.push(s);o.saleId=s.id;o.status='Продан';save();closeModal();view='sales';render();openSaleDetail(s);notify('Продажа проведена, остатки списаны')}
function orderText(o){let p=db.profile;return `DronePlus+ · Заказ №${o.number} от ${o.date}\n${o.customerName?'Покупець: '+o.customerName+'\n':''}\n`+o.items.map((i,k)=>`${k+1}. ${i.name}${i.sku?' ['+i.sku+']':''}\n   ${i.qty} шт. × ${money(i.unitPrice)} = ${money(i.qty*i.unitPrice)}`).join('\n')+`\n\nИТОГО: ${money(orderSum(o))}\n${p.sellerName?'Получатель: '+p.sellerName+'\n':''}${p.iban?'IBAN: '+p.iban+'\n':''}${p.taxId?'РНОКПП/ЄДРПОУ: '+p.taxId+'\n':''}${o.note?'Примечание: '+o.note+'\n':''}`}
function fallbackCopy(text){const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');notify('Перечень скопирован. Вставь его в мессенджер')}catch{notify('Не получилось скопировать перечень')}a.remove()}
function shareOrder(o){const t=orderText(o);if(navigator.share){navigator.share({title:'Заказ DRONPLUS+ №'+o.number,text:t}).catch(err=>{if(err?.name!=='AbortError')copyOrder(t)})}else copyOrder(t)}
function copyOrder(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>notify('Перечень скопирован в буфер обмена')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function profileView(){let p=db.profile;return header('Реквізити ФОП','Для рахунків на оплату покупцям')+`<form id="profileform"><div class="formbox"><div class="formtitle">Отримувач коштів</div>${field('ФОП (ФИО полностью) *','sellerName','text',p.sellerName,'required maxlength="180"')}${field('РНОКПП / ЄДРПОУ *','taxId','text',p.taxId,'required maxlength="20"')}${field('IBAN UA… *','iban','text',p.iban,'required maxlength="34" autocapitalize="characters"')}${field('Назва банку','bank','text',p.bank,'maxlength="120"')}${field('Адрес (необязательно)','address','text',p.address,'maxlength="250"')}${field('Контактний телефон','phone','tel',p.phone,'maxlength="50"')}${field('Призначення платежу','paymentNote','text',p.paymentNote,'maxlength="200"')}</div><div class="note" style="margin-bottom:12px">Реквизиты не подставляются автоматически из переписки: проверь IBAN и данные ФОП перед отправкой первого счёта. На счёте будет указано «Без ПДВ».</div><button class="primary good wide" type="submit">${icon('check')} Зберегти реквізити</button></form>`}
function saveProfile(f){let d=getFormData(f),iban=d.iban.replace(/\s/g,'').toUpperCase();if(!d.sellerName.trim()||!d.taxId.trim()||!/^UA\d{27}$/.test(iban)){notify('Перевір ФИО, код и IBAN: UA + 27 цифр');return}db.profile={sellerName:d.sellerName.trim(),taxId:d.taxId.trim(),iban,bank:d.bank.trim(),address:d.address.trim(),phone:d.phone.trim(),paymentNote:d.paymentNote.trim(),vat:'Без ПДВ'};save();notify('Реквизиты сохранены');view='orders';render()}
function printInvoice(o){let p=db.profile;if(!p.sellerName.trim()||!p.taxId.trim()||!/^UA\d{27}$/.test(p.iban.replace(/\s/g,''))){closeModal();view='profile';render();notify('Сначала заполни реквизиты ФОП для счёта');return}const date=o.date.split('-').reverse().join('.');const rows=o.items.map((i,k)=>`<tr><td>${k+1}</td><td>${esc(i.name)}${i.sku?`<div class="muted">Арт. ${esc(i.sku)}</div>`:''}</td><td class="center">${i.qty}</td><td class="right">${fmt.format(i.unitPrice)}</td><td class="right">${fmt.format(i.qty*i.unitPrice)}</td></tr>`).join('');const html=`<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Рахунок DRONPLUS №${esc(o.number)}</title><style>*{box-sizing:border-box}body{background:#eef1f6;color:#161e30;font:14px/1.45 Arial,sans-serif;margin:0;padding:22px}.paper{max-width:800px;margin:auto;background:white;padding:42px 44px;box-shadow:0 10px 45px #12243b20}.brand{font-size:26px;letter-spacing:-1px;font-weight:900}.brand b{color:#ec4258}.h{font-weight:850;font-size:23px;margin:32px 0 22px}.muted{color:#687586;font-size:12px}.row{padding:6px 0}.row b{display:inline-block;min-width:115px}.divider{border-top:2px solid #152339;margin:23px 0}table{width:100%;border-collapse:collapse;margin-top:25px}th{background:#f0f3f6;text-align:left;font-size:12px}th,td{padding:10px 8px;border-bottom:1px solid #e4e8ed;vertical-align:top}td:first-child,th:first-child{width:35px}td.center{text-align:center}td.right,th.right{text-align:right;white-space:nowrap}.total{display:flex;justify-content:flex-end;gap:20px;font-size:19px;font-weight:850;margin:24px 0}.foot{color:#687586;font-size:12px;margin-top:45px}.toolbar{max-width:800px;margin:0 auto 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.toolbar button{border:0;background:#152339;border-radius:9px;padding:11px 18px;color:white;font-weight:bold;cursor:pointer}@page{size:A4;margin:12mm}@media print{body{background:#fff;padding:0}.toolbar{display:none}.paper{padding:0;box-shadow:none;max-width:none}tr{break-inside:avoid}}@media(max-width:520px){.paper{padding:26px 17px}.row b{min-width:90px}body{padding:10px}th,td{padding:7px 4px;font-size:11px}.total{font-size:16px}}</style></head><body><div class="toolbar"><b>Рахунок готовий до друку</b><button onclick="window.print()">Друкувати / Зберегти PDF</button></div><article class="paper"><div class="brand">DronePlus<b>+</b></div><div class="muted">Запчастини та комплектуючі</div><h1 class="h">Рахунок на оплату № ${esc(o.number)} від ${esc(date)}</h1><div class="divider"></div><div class="row"><b>Постачальник:</b> ${esc(p.sellerName)}</div><div class="row"><b>РНОКПП/ЄДРПОУ:</b> ${esc(p.taxId)}</div><div class="row"><b>IBAN:</b> ${esc(p.iban)}</div>${p.bank?`<div class="row"><b>Банк:</b> ${esc(p.bank)}</div>`:''}${p.address?`<div class="row"><b>Адреса:</b> ${esc(p.address)}</div>`:''}${p.phone?`<div class="row"><b>Телефон:</b> ${esc(p.phone)}</div>`:''}<div class="divider"></div><div class="row"><b>Покупець:</b> ${esc(o.customerName||'Не зазначений')}</div>${o.buyerCode?`<div class="row"><b>ЄДРПОУ/РНОКПП:</b> ${esc(o.buyerCode)}</div>`:''}<table><thead><tr><th>№</th><th>Найменування товару</th><th>К-сть</th><th class="right">Ціна, грн</th><th class="right">Сума, грн</th></tr></thead><tbody>${rows}</tbody></table><div class="total"><span>Разом до сплати:</span><span>${money(orderSum(o))}</span></div><div style="text-align:right;font-weight:700">Без ПДВ</div>${p.paymentNote?`<p><b>Призначення платежу:</b> ${esc(p.paymentNote)} №${esc(o.number)}</p>`:''}${o.note?`<p><b>Примітка:</b> ${esc(o.note)}</p>`:''}<p class="foot">Цей рахунок є пропозицією оплати та не підтверджує фактичну оплату. Не є фіскальним чеком.</p></article></body></html>`;const w=window.open('','_blank');if(!w){newFile('Rakhunok_DRONPLUS_'+o.number+'.html',html,'text/html;charset=utf-8');notify('Спливне вікно заблоковано — рахунок збережено як HTML');return}w.document.open();w.document.write(html);w.document.close()}
function calculatorView(){let cfg=db.calc,p=calcFocusProduct?product(calcFocusProduct):null;const cost=p?.avgCostUAH>0?Math.round(p.avgCostUAH*100)/100:'';return header('Калькулятор націнки','Введи закупівлю — решта рахується автоматично')+(p?`<div class="note" style="margin-bottom:12px">Товар: <b>${esc(p.name)}</b>. За потреби застосуй нову ціну до картки товару.</div>`:'')+`<form id="calcform" onsubmit="return false"><div class="formbox"><div class="formtitle">Вартість одиниці</div>${field('Закупівельна ціна за 1 шт., ₴','cost','number',cost,'min="0" step="0.01" inputmode="decimal" placeholder="1000"')}<div class="fieldrow">${field('Резерв на податки, %','taxPct','number',cfg.taxPct,'min="0" max="1000" step="0.1" inputmode="decimal"')}${field('Націнка на вартість із резервом, %','markup','number',cfg.markup,'min="-100" max="10000" step="0.01" inputmode="decimal"')}</div><p class="hint">Приклад: закупівля 1 000 ₴ + 27% резерву = 1 270 ₴; + 50% націнки = 1 905 ₴.</p></div><div class="calc-pricebox"><div class="calc-kicker">Рекомендована ціна продажу · можна змінити вручну</div><div class="calc-price"><input id="calc-price" name="price" type="number" min="0" step="0.01" inputmode="decimal" aria-label="Ціна продажу, гривні" placeholder="1905"></div><div class="calc-round"><button type="button" data-action="round-calc" data-round="10">Округлити до 10 ₴</button><button type="button" data-action="round-calc" data-round="50">До 50 ₴</button><button type="button" data-action="round-calc" data-round="100">До 100 ₴</button></div></div><div id="calcpreview"></div><div class="btnrow"><button type="button" class="ghost" data-action="save-calc">Зберегти %</button>${p?`<button type="button" class="primary good" data-action="apply-calc">Застосувати ціну</button>`:''}</div></form><p class="calc-notice">Резерв — це умовні витрати для встановлення ціни, а не законодавча ставка податку. До реальної прибутковості також можуть впливати комісії, доставка й інші витрати, які тут не включені.</p>`}
function computeCalc(){const f=document.getElementById('calcform');if(!f)return null;const cost=num(f.elements.cost.value),taxPct=num(f.elements.taxPct.value),markup=num(f.elements.markup.value),price=num(f.elements.price.value);if(!Number.isFinite(cost)||cost<0||!Number.isFinite(taxPct)||taxPct<0||taxPct>1000||!Number.isFinite(markup)||markup< -100||markup>10000||!Number.isFinite(price)||price<0)return null;const reserve=cost*taxPct/100,base=cost+reserve,net=price-base;return {cost,taxPct,markup,price,reserve,base,net,cfg:{...db.calc,taxPct,markup}}}
function refreshCalculator(source='auto'){let f=document.getElementById('calcform'),el=document.getElementById('calcpreview');if(!f||!el)return;let cost=num(f.elements.cost.value),taxPct=num(f.elements.taxPct.value),markup=num(f.elements.markup.value);if(!f.elements.cost.value.trim()||!Number.isFinite(cost)||cost<0||!Number.isFinite(taxPct)||taxPct<0||taxPct>1000||!Number.isFinite(markup)||markup< -100||markup>10000){if(source!=='price')f.elements.price.value='';el.innerHTML='<div class="note">Введи закупівельну ціну та перевір відсотки.</div>';return}let base=cost*(1+taxPct/100);if(source==='price'){let price=num(f.elements.price.value);if(Number.isFinite(price)&&price>=0&&base>0){f.elements.markup.value=String(Math.round((price/base-1)*10000)/100)}else if(base===0){f.elements.markup.value='0'}}else{f.elements.price.value=String(Math.round(base*(1+markup/100)*100)/100)}let x=computeCalc();if(!x){el.innerHTML='<div class="note">Перевір ціну продажу.</div>';return}el.innerHTML=`<div class="calc-profit"><div>Прибуток з 1 шт.</div><b>${money(x.net)}</b><div class="hint">Після віднімання закупівлі та резерву</div></div><div class="calc-result"><div class="totalrow"><span>Закупівля / 1 шт.</span><strong>${money(x.cost)}</strong></div><div class="totalrow"><span>Умовний резерв (${fmt.format(x.taxPct)}%)</span><strong>${money(x.reserve)}</strong></div><div class="totalrow"><span>Закупівля + резерв</span><strong>${money(x.base)}</strong></div><div class="sep"></div><div class="totalrow"><span>Ціна продажу</span><strong>${money(x.price)}</strong></div><div class="totalrow"><span>Націнка (${fmt.format(x.markup)}%)</span><strong class="profit">${money(x.net)}</strong></div></div>`}
function saveCalcPrefs(){let x=computeCalc();if(!x){notify('Перевір поля калькулятора');return}db.calc=x.cfg;save();notify('Параметри калькулятора збережено')}
function applyCalcPrice(){let x=computeCalc(),p=product(calcFocusProduct);if(!x||!p){notify('Вкажи правильну ціну закупівлі');return}if(!confirm(`Встановити ціну ${money(x.price)} для «${p.name}»?`))return;db.calc=x.cfg;p.priceUAH=x.price;save();calcFocusProduct='';view='products';render();notify('Ціну продажу оновлено')}

// Делегирование действий: одна точка обработки для всех экранов
const doc=document;
doc.addEventListener('click',e=>{const t=e.target.closest('[data-nav],[data-open],[data-product],[data-sale],[data-purchase],[data-order],[data-category],[data-salesfilter],[data-action],[data-export],[data-remove-item],[data-remove-order-item],#additem,#orderadd,#closemodal,#import-btn');if(!t){if(e.target.id==='sheetwrap')closeModal();return}if(t.dataset.nav){view=t.dataset.nav;render();scrollTo({top:0,behavior:'instant'});return}if(t.dataset.category){category=t.dataset.category;render();return}if(t.dataset.salesfilter){saleFilter=t.dataset.salesfilter;render();return}if(t.dataset.open){({product:()=>openProductForm(),purchase:()=>openPurchaseForm(),sale:()=>openSaleForm(),order:()=>openOrderForm()}[t.dataset.open])();return}if(t.dataset.product){let p=product(t.dataset.product);if(p)openProductDetail(p);return}if(t.dataset.sale){let s=db.sales.find(x=>x.id===t.dataset.sale);if(s)openSaleDetail(s);return}if(t.dataset.purchase){let p=db.purchases.find(x=>x.id===t.dataset.purchase);if(p)openPurchaseDetail(p);return}if(t.dataset.order){let o=db.orders.find(x=>x.id===t.dataset.order);if(o)openOrderDetail(o);return}if(t.dataset.export){exportFile(t.dataset.export);return}if(t.id==='import-btn'){doc.getElementById('importfile')?.click();return}if(t.id==='closemodal'){closeModal();return}if(t.id==='orderadd'){const holder=doc.createElement('div');holder.innerHTML=orderLine();doc.getElementById('orderrows').append(holder.firstElementChild);refreshOrderPreview();return}if(t.dataset.removeOrderItem!==undefined){const rows=orderRows();if(rows.length<=1){notify('До замовленняе должна быть минимум одна позиция');return}t.closest('.cartitem').remove();refreshOrderPreview();return}if(t.id==='additem'){let holder=doc.createElement('div');holder.innerHTML=cartLine();doc.getElementById('cartrows').append(holder.firstElementChild);refreshSalePreview();return}if(t.dataset.removeItem!==undefined){let rows=cartRows();if(rows.length<=1){notify('В продаже должна остаться хотя бы одна позиция');return}t.closest('.cartitem').remove();refreshSalePreview();return}if(t.dataset.action){let id=t.dataset.id;switch(t.dataset.action){case 'markup-product':{calcFocusProduct=id;closeModal();view='calculator';render();break}case 'order-product':closeModal();openOrderForm(null,id);break;case 'edit-order':{let o=db.orders.find(x=>x.id===id);if(o)openOrderForm(o);break}case 'invoice-order':{let o=db.orders.find(x=>x.id===id);if(o)printInvoice(o);break}case 'share-order':{let o=db.orders.find(x=>x.id===id);if(o)shareOrder(o);break}case 'paid-order':{let o=db.orders.find(x=>x.id===id);if(o&&o.status!=='Продан'&&o.status!=='Отменён'){o.status='Оплачен';save();closeModal();render();openOrderDetail(o)}break}case 'cancel-order':{let o=db.orders.find(x=>x.id===id);if(o&&o.status!=='Продан'&&confirm('Скасувати замовлення №'+o.number+'?')){o.status='Отменён';save();closeModal();render()}break}case 'convert-order':convertOrder(id);break;case 'round-calc':{const f=doc.getElementById('calcform'),step=num(t.dataset.round);if(f&&step>0&&Number.isFinite(num(f.elements.price.value))){f.elements.price.value=String(Math.round(num(f.elements.price.value)/step)*step);refreshCalculator('price')}break}case 'save-calc':saveCalcPrefs();break;case 'apply-calc':applyCalcPrice();break;case 'sell-product':closeModal();openSaleForm(id);break;case 'restock-product':closeModal();openPurchaseForm(id);break;case 'edit-product':{let p=product(id);if(p)openProductForm(p);break}case 'archive-product':{let p=product(id);if(p&&confirm('Переместить товар «'+p.name+'» в архив? Его остаток сохранится, но товар исчезнет из активного списка.')){p.archived=true;save();closeModal();render();notify('Товар перемещён в архив')}break}case 'edit-sale':{let s=db.sales.find(x=>x.id===id);if(s)openEditSale(s);break}case 'cancel-sale':cancelSale(id);break}return}});
doc.addEventListener('submit',e=>{const formId=e.target.getAttribute('id');if(!['productform','purchaseform','saleform','editsaleform','orderform','profileform'].includes(formId))return;e.preventDefault();({productform:handleProductForm,purchaseform:handlePurchaseForm,saleform:handleSaleForm,editsaleform:handleEditSale,orderform:handleOrderForm,profileform:saveProfile}[formId])(e.target)});
doc.addEventListener('input',e=>{if(e.target.id==='product-search'){let val=e.target.value,sel=e.target.selectionStart;query=val;let parent=document.getElementById('main');if(!parent)return;let f=productsView();parent.innerHTML=f;let input=doc.getElementById('product-search');if(input){input.focus();try{input.setSelectionRange(sel,sel)}catch{}}return}if(e.target.closest('#orderform'))refreshOrderPreview();if(e.target.closest('#calcform'))refreshCalculator(e.target.name==='price'?'price':'auto');if(e.target.closest('#saleform'))refreshSalePreview();if(e.target.closest('#purchaseform'))refreshPurchasePreview()});
doc.addEventListener('change',e=>{if(e.target.id==='monthPicker'){monthFilter=e.target.value||month();render();return}if(e.target.id==='importfile'){importFile(e.target.files?.[0]);return}if(e.target.matches('[name=orderProduct]')){let p=product(e.target.value);e.target.closest('.cartitem').querySelector('[name=orderPrice]').value=p?.priceUAH??0;refreshOrderPreview();return}if(e.target.matches('[name=cartProduct]')){let p=product(e.target.value);e.target.closest('.cartitem').querySelector('[name=cartPrice]').value=p?.priceUAH??0;refreshSalePreview();return}if(e.target.matches('#purchaseform [name=productId]')){let p=product(e.target.value);let f=e.target.form;f.elements.usd.value=p?.costUSD||'';f.elements.rate.value=p?.rate||'';refreshPurchasePreview()}});
doc.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('sheetwrap'))closeModal()});
render();if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js?v=3').catch(()=>{})}
})();
</script>
